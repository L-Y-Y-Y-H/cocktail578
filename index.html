<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12100e">
<title>鸡尾酒大全 · 手机版</title>
<style>
:root{
  --bg:#faf8f4; --card:#fff; --line:#e9e3d9; --fg:#1c1a17; --dim:#8a8378;
  --gold:#b8860b; --accent:#c0392b; --chip:#f2ede4; --tip-bg:#fdf6e3;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12100e; --card:#1c1917; --line:#2e2a26; --fg:#eee9e2; --dim:#9a938a;
         --chip:#26221f; --tip-bg:#2a2418; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 9px;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
h1 small{font-size:12px;color:var(--dim);font-weight:400}
.search{display:flex;gap:8px}
input[type=search]{flex:1;font-size:16px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);outline:none;min-width:0}
input[type=search]:focus{border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13.5px;padding:8px 14px;border-radius:999px;background:var(--chip);
  color:var(--fg);border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);font-weight:600}
main{padding:10px 12px calc(env(safe-area-inset-bottom) + 28px)}
.row{display:flex;gap:12px;padding:10px;margin-bottom:9px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;align-items:center}
.row img{width:66px;height:66px;border-radius:11px;object-fit:cover;flex:0 0 auto;background:var(--chip)}
.row .t{flex:1;min-width:0}
.row .n{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .e{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .m{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:6px;padding:2px 7px}
.star{font-size:19px;padding:6px 2px 6px 8px;color:var(--dim)}
.star.on{color:#e8b100}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;line-height:2}
.more{text-align:center;color:var(--dim);font-size:13px;padding:14px}
/* 详情页 */
.detail{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
.detail.show{display:block}
.dbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;z-index:5}
.back{font-size:16px;padding:8px 12px;border-radius:10px;background:var(--chip);border:0;color:var(--fg)}
.dwrap{padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
.hero{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:var(--chip)}
.dname{font-size:23px;font-weight:700;margin:14px 0 2px}
.den{font-size:13px;color:var(--dim);margin-bottom:10px}
.dmeta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.lab{font-size:12.5px;letter-spacing:2px;color:var(--gold);font-weight:700;margin:20px 0 8px}
.ing{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ing div{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;font-size:14.5px;
  border-bottom:1px solid var(--line)}
.ing div:last-child{border-bottom:0}
.ing .mm{color:var(--dim);white-space:nowrap}
/* 材料类型标签 */
.ty{font-size:12px;padding:1px 6px;border-radius:5px;margin-left:5px;white-space:nowrap;display:inline-block}
.ty.wine{background:#3a2418;color:#f0b06a;border:1px solid #6a4526}
.ty.fruit{background:#1d2c1a;color:#9ed07f;border:1px solid #37612c}
.ty.syrup{background:#33241a;color:#e8b06a;border:1px solid #6b4a22}
.ty.drink{background:#16232e;color:#7fc4e8;border:1px solid #2c4d63}
.ty.plant{background:#1c2a1c;color:#8fd08f;border:1px solid #355c35}
.ty.season{background:#2b2430;color:#c9a6e0;border:1px solid #4d3a5c}
.ty.other{background:#232323;color:#a8a8a8;border:1px solid #3d3d3d}
/* 我有 按钮 / 推荐提示 */
.have{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--dim);white-space:nowrap;margin-left:6px}
.have.on{background:#243a1e;border-color:#4a7a3a;color:#b6e39a}
.ing div{align-items:center}
.rec{font-size:12px;margin-top:4px;line-height:1.5}
.rec.can{color:#9ed07f}
.rec.miss{color:#e0a86a}
/* 顶部「我的材料」按钮 */
.mypan{flex:0 0 auto;font-size:13px;padding:0 13px;border-radius:12px;background:var(--chip);
       border:1px solid var(--line);color:var(--fg);white-space:nowrap;height:44px}
.mypan.on{background:var(--fg);color:var(--bg);font-weight:600}
/* 我的材料面板 */
.panel{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none;
       -webkit-overflow-scrolling:touch}
.panel.show{display:block}
.prow{display:flex;gap:10px;align-items:center;padding:10px 2px;font-size:15px;border-bottom:1px solid var(--line)}
.prow input{width:20px;height:20px;accent-color:var(--gold)}
.prow .rt{margin-left:auto;color:var(--dim);font-size:12.5px}
.pnote{background:var(--tip-bg);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:#8a6a2a;margin:12px 0}
ol.steps{margin:0;padding-left:22px;font-size:15px;line-height:1.75}
ol.steps li{margin-bottom:8px}
.tip{background:var(--tip-bg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;color:#8a6a2a}
@media (prefers-color-scheme:dark){.tip{color:#d8bd7a}}
.foot{text-align:center;color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);
  background:#000c;color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;
  transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style></head><body>
<header>
  <h1>鸡尾酒大全 <small id="cnt"></small></h1>
  <div class="search">
    <input id="q" type="search" placeholder="搜酒名 / 材料（中英文都行）" autocomplete="off" enterkeyhint="search">
    <button class="mypan" id="mypan">我的材料 <span id="pcnt">0</span></button>
  </div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="alcs"></div>
  <div class="chips" id="types"></div>
</header>
<main id="list"></main>
<div class="detail" id="detail"></div>
<div class="panel" id="pantry"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = [{"id":"15853","cn":"B-52 轰炸机","en":"B-52","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":["IBA","NewEra"],"cost":[3.9,6.4],"img":"img/15853.jpg","ings":[{"zh":"百利甜酒/爱尔兰奶油","m":"1/3","t":"酒","k":"baileys"},{"zh":"君度/三重橙酒","m":"1/3","t":"酒","k":"cointreau"},{"zh":"咖啡利口酒","m":"1/4","t":"酒","k":"coffee-liqueur"}],"steps":["子弹杯擦干净，先倒咖啡利口酒（最底层，密度最大）","用勺背贴着杯壁，极缓倒入百利甜酒","同样手法倒入君度，形成第三层","不要搅拌，端上桌一口闷（或慢慢啜）"],"tip":"分层的秘诀是密度和「慢」：勺背贴壁、细流。手抖了也没关系，味道一样好。"},{"id":"17186","cn":"三叶草俱乐部","en":"Clover Club","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic"],"cost":[2.7,5.3],"img":"img/17186.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"石榴糖浆","m":"2 tsp","t":"糖浆","k":"grenadine"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"蛋白","m":"1","t":"其他","k":"egg-white"}],"steps":["干摇原料使其乳化，加冰，摇和后滤入纯饮杯中。"],"tip":""},{"id":"17241","cn":"僵尸","en":"Zombie","cat":"鸡尾酒","alc":"含酒精","glass":"Hurricane glass","tags":[],"cost":[19.5,36.8],"img":"img/17241.jpg","ings":[{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"},{"zh":"苦艾酒","m":"1 tsp","t":"酒","k":"absinthe"},{"zh":"石榴糖浆","m":"1 tsp","t":"糖浆","k":"grenadine"},{"zh":"青柠","m":"1 tsp","t":"水果","k":"lime"},{"zh":"安高天娜苦精","m":"1 drop","t":"酒","k":"bitters"}],"steps":["高速搅打不超过5秒。倒入杯中，加冰块至满，然后加上装饰。*唐氏糖浆（Donn's mix）：将3根压碎的肉桂棒、1杯糖和1杯水煮沸，边煮边搅拌至糖溶解。小火煮2分钟，然后离火静置至少2小时，再滤入干净的玻璃瓶中。然后将1份该糖浆与2份新鲜西柚汁混合。"],"tip":""},{"id":"11003","cn":"内格罗尼","en":"Negroni","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","Classic"],"cost":[7.4,11.7],"img":"img/11003.jpg","ings":[{"zh":"金酒","m":"1 oz","t":"酒","k":"gin"},{"zh":"金巴利","m":"1 oz","t":"酒","k":"campari"},{"zh":"甜味美思（红）","m":"1 oz","t":"酒","k":"sweet-vermouth"}],"steps":["古典杯放入一块大冰（或几块方冰）","三种材料等份倒入调酒杯，加冰搅拌 20 秒","滤入古典杯","橙皮在杯口上方挤压出精油后投入杯中"],"tip":"三者等份是标准版；怕苦可以金酒多一点、金巴利少一点。橙皮油是灵魂，别省。"},{"id":"17191","cn":"农夫潘趣","en":"Planter's Punch","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","Classic"],"cost":[5.5,10.1],"img":"img/17191.jpg","ings":[{"zh":"黑朗姆/深色朗姆","m":"1 part","t":"酒","k":"dark-rum"},{"zh":"杏仁糖浆 Orgeat","m":"1/2 part","t":"糖浆","k":"almond-syrup"},{"zh":"橙汁","m":"2 parts","t":"饮料","k":"orange-juice"},{"zh":"菠萝汁","m":"1 part","t":"饮料","k":"pineapple-juice"}],"steps":["除苦精外，将所有配料倒入装满冰块的摇酒壶中。充分摇和。倒入装满冰块的大杯中。在表面加入安高天娜苦精。以鸡尾酒樱桃和菠萝装饰。"],"tip":""},{"id":"12770","cn":"冰咖啡","en":"Iced Coffee","cat":"咖啡/茶","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[12.2,29.6],"img":"img/12770.jpg","ings":[{"zh":"浓缩咖啡","m":"1/4 cup instant","t":"饮料","k":"espresso"},{"zh":"糖浆","m":"1/4 cup","t":"糖浆","k":"syrup"},{"zh":"水","m":"1/4 cup hot","t":"饮料","k":"x:水"},{"zh":"淡奶油/牛奶","m":"4 cups cold","t":"饮料","k":"cream"}],"steps":["搅拌至咖啡和糖溶解。加入牛奶。充分摇和。使用搅拌机或奶昔机制作，可得到泡沫丰富的饮品。倒入咖啡杯中饮用。"],"tip":""},{"id":"178334","cn":"午后之死","en":"Death in the Afternoon","cat":"鸡尾酒","alc":"含酒精","glass":"Margarita glass","tags":["Drunk"],"cost":[26.7,47.5],"img":"img/178334.jpg","ings":[{"zh":"苦艾酒","m":"2 shots","t":"酒","k":"absinthe"},{"zh":"起泡酒/香槟","m":"Top","t":"酒","k":"sparkling"}],"steps":["随你喜欢，将苦艾酒倒入冰镇过的酒杯中，补满香槟。为达最佳效果，务必在午后饮用。"],"tip":""},{"id":"11202","cn":"卡琵利亚","en":"Caipirinha","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["ContemporaryClassic","IBA"],"cost":[12.5,25.1],"img":"img/11202.jpg","ings":[{"zh":"糖浆","m":"2 tsp","t":"糖浆","k":"syrup"},{"zh":"青柠","m":"1","t":"水果","k":"lime"},{"zh":"卡莎萨","m":"2 1/2 oz","t":"酒","k":"cachaca"}],"steps":["将青柠和糖放入古典杯，捣压（用捣棒或木勺将两种原料捣碎混合）。用冰块填满杯子，加入卡莎萨。"],"tip":""},{"id":"11001","cn":"古典","en":"Old Fashioned","cat":"鸡尾酒","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","Classic","Alcoholic","Expensive","Savory"],"cost":[5.3,10.5],"img":"img/11001.jpg","ings":[{"zh":"波本威士忌","m":"4.5 cL","t":"酒","k":"bourbon"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"糖浆","m":"1 cube","t":"糖浆","k":"syrup"},{"zh":"水","m":"dash","t":"饮料","k":"x:水"}],"steps":["古典杯中放入糖浆与苦精，搅匀","放入一块大冰，倒入威士忌","搅拌 20–25 秒，让酒液充分冷却稀释","橙皮挤压出精油后擦拭杯口并投入杯中，可加一颗樱桃"],"tip":"这就是「最古老的鸡尾酒公式」：烈酒 + 糖 + 苦精 + 水（冰的融化）。大冰块融化慢，越喝越有层次。"},{"id":"17255","cn":"吉姆雷特","en":"Gimlet","cat":"鸡尾酒","alc":"含酒精","glass":"Martini Glass","tags":[],"cost":[24.3,48.8],"img":"img/17255.jpg","ings":[{"zh":"金酒","m":"2 1/2 oz","t":"酒","k":"gin"},{"zh":"青柠","m":"1/2 oz","t":"水果","k":"lime"},{"zh":"糖浆","m":"1/2 oz","t":"糖浆","k":"syrup"},{"zh":"青柠","m":"1","t":"水果","k":"lime"}],"steps":["鸡尾酒杯提前冰镇","三种材料倒入摇壶，加满冰","摇和 10–12 秒至壶壁结霜","双重过滤滤入冰镇杯中","放青柠片装饰"],"tip":"传统英式做法用「玫瑰牌青柠汁」（含糖），若用鲜榨青柠汁必须补糖浆，否则太尖酸。"},{"id":"17205","cn":"含羞草","en":"Mimosa","cat":"普通饮品","alc":"含酒精","glass":"Champagne flute","tags":["IBA","ContemporaryClassic"],"cost":[0.7,1.5],"img":"img/17205.jpg","ings":[{"zh":"起泡酒/香槟","m":"Chilled","t":"酒","k":"sparkling"},{"zh":"橙汁","m":"2 oz","t":"饮料","k":"orange-juice"}],"steps":["橙汁与起泡酒都冷藏","先倒橙汁到杯中","再沿杯壁注入起泡酒","轻搅一下，可挤一点橙皮油"],"tip":"橙汁:起泡酒 = 1:2 是经典比例。用鲜榨橙汁+干型起泡酒，和用瓶装橙汁完全是两种酒。"},{"id":"12107","cn":"咸狗","en":"Salty Dog","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[1.5,3.1],"img":"img/12107.jpg","ings":[{"zh":"西柚汽水/西柚汁","m":"5 oz","t":"饮料","k":"grapefruit-soda"},{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"盐","m":"1/4 tsp","t":"调料","k":"salt"}],"steps":["将所有配料倒在海波杯中的冰块上。充分搅拌后饮用。（如喜欢，可用伏特加代替金酒。）"],"tip":""},{"id":"17203","cn":"基尔","en":"Kir","cat":"普通饮品","alc":"含酒精","glass":"Wine Glass","tags":["IBA","ContemporaryClassic"],"cost":[12.0,30.0],"img":"img/17203.jpg","ings":[{"zh":"黑醋栗奶油","m":"1 part","t":"调料","k":"x:黑醋栗奶油"},{"zh":"起泡酒/香槟","m":"5 parts","t":"酒","k":"sparkling"}],"steps":["将黑加仑利口酒加至杯底，然后补满葡萄酒。"],"tip":""},{"id":"11006","cn":"大吉利","en":"Daiquiri","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic","Beach"],"cost":[4.5,8.5],"img":"img/11006.jpg","ings":[{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"青柠","m":"Juice of 1/2","t":"水果","k":"lime"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"}],"steps":["杯子提前冰镇","三种材料倒入摇壶加满冰","摇和 12 秒至壶壁明显结霜","双重过滤滤入冰镇杯中","青柠片装饰"],"tip":"海明威版本（Daiquiri No.3）会加一点西柚汁和黑樱桃利口酒，可自行尝试。"},{"id":"17196","cn":"大都会","en":"Cosmopolitan","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","ContemporaryClassic"],"cost":[16.2,32.9],"img":"img/17196.jpg","ings":[{"zh":"伏特加","m":"1 1/4 oz","t":"酒","k":"vodka"},{"zh":"青柠","m":"1/4 oz","t":"水果","k":"lime"},{"zh":"君度/三重橙酒","m":"1/4 oz","t":"酒","k":"cointreau"},{"zh":"蔓越莓汁","m":"1/4 cup","t":"饮料","k":"cranberry-juice"}],"steps":["杯子提前冰镇","所有材料加冰摇和 12 秒","双重过滤滤入冰镇杯中","橙皮在杯口挤油后装饰"],"tip":"蔓越莓汁别超过 30ml，否则颜色发暗、甜味盖过柑橘。用柑橘伏特加（如绝对柑橘）更接近经典。"},{"id":"17190","cn":"天堂","en":"Paradise","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA"],"cost":[26.8,53.7],"img":"img/17190.jpg","ings":[{"zh":"金酒","m":"7 parts","t":"酒","k":"gin"},{"zh":"白兰地/干邑","m":"4 parts","t":"酒","k":"brandy"},{"zh":"橙汁","m":"3 parts","t":"饮料","k":"orange-juice"}],"steps":["加冰一起摇和。滤入鸡尾酒杯，冰镇后享用。"],"tip":""},{"id":"11004","cn":"威士忌酸","en":"Whiskey Sour","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","Classic","Alcoholic","ContemporaryClassic"],"cost":[8.9,18.1],"img":"img/11004.jpg","ings":[{"zh":"波本威士忌","m":"2 oz","t":"酒","k":"bourbon"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1/2 tsp","t":"糖浆","k":"syrup"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"柠檬","m":"1/2 slice","t":"水果","k":"lemon"}],"steps":["所有材料（含蛋白）先不加冰干摇 10 秒","加冰再摇 12 秒","滤入加了方冰的古典杯","柠檬片与樱桃装饰"],"tip":"不加蛋白也行，但加了泡沫好看很多。喜欢更柔和可以加一点蛋白+安高天娜苦精点在泡沫上。"},{"id":"17250","cn":"尸体复活者","en":"Corpse Reviver","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[48.4,95.1],"img":"img/17250.jpg","ings":[{"zh":"金酒","m":"3/4 oz","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"3/4 oz","t":"酒","k":"cointreau"},{"zh":"利莱酒布兰科","m":"3/4 oz","t":"","k":"x:利莱酒布兰科"},{"zh":"柠檬","m":"3/4 oz","t":"水果","k":"lemon"},{"zh":"苦艾酒","m":"1 dash","t":"酒","k":"absinthe"}],"steps":["摇和，滤入，纯饮，用苦艾酒涮过的鸡尾酒杯"],"tip":""},{"id":"17267","cn":"巴哈马妈妈","en":"Bahama Mama","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[14.0,25.9],"img":"img/17267.jpg","ings":[{"zh":"白朗姆","m":"3 parts","t":"酒","k":"white-rum"},{"zh":"黑朗姆/深色朗姆","m":"1 part","t":"酒","k":"dark-rum"},{"zh":"香蕉利口酒","m":"1 part","t":"酒","k":"x:香蕉利口酒"},{"zh":"石榴糖浆","m":"1 part","t":"糖浆","k":"grenadine"},{"zh":"菠萝汁","m":"2 parts","t":"饮料","k":"pineapple-juice"},{"zh":"橙汁","m":"2 parts","t":"饮料","k":"orange-juice"},{"zh":"酸甜汁","m":"1 part","t":"饮料","k":"x:酸甜汁"}],"steps":["加入 2 份苏打水，或按口味增减。全部混合均匀，倒在大量冰块上。用吸管饮用。"],"tip":""},{"id":"17253","cn":"帕洛玛","en":"Paloma","cat":"鸡尾酒","alc":"含酒精","glass":"Collins glass","tags":[],"cost":[5.3,10.6],"img":"img/17253.jpg","ings":[{"zh":"葡萄苏打水","m":"3 oz","t":"饮料","k":"soda"},{"zh":"龙舌兰（银标）","m":"1 1/2 oz","t":"酒","k":"tequila"}],"steps":["高球杯口可蘸一圈盐（可选）","加满冰，倒入龙舌兰与青柠汁","注入冰镇西柚汽水","西柚片装饰，轻搅一下"],"tip":"墨西哥人的日常鸡尾酒，比玛格丽特更解渴。用鲜榨西柚汁+苏打水更好喝，但西柚汽水最省事。"},{"id":"11005","cn":"干马天尼","en":"Dry Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic","Christmas","Alcoholic"],"cost":[1.1,2.0],"img":"img/11005.jpg","ings":[{"zh":"金酒","m":"1 2/3 oz","t":"酒","k":"gin"},{"zh":"干味美思（白）","m":"1/3 oz","t":"酒","k":"dry-vermouth"},{"zh":"青橄榄","m":"1","t":"植物材料","k":"olive"}],"steps":["马天尼杯提前冷藏，或加冰预冷后倒掉冰水","量取金酒与干味美思倒入调酒杯，加满冰块","用吧勺沿杯壁搅拌 20–30 秒，充分冷却并轻微稀释","滤入冰镇好的杯中，尽量不留碎冰","投入橄榄，或挤一片柠檬皮油在表面"],"tip":"比例没有唯一标准：5:1 干爽、3:1 平衡、1:1 就是「湿马天尼」。一定要搅拌而不是摇和，否则酒体会浑浊。"},{"id":"12754","cn":"性感沙滩","en":"Sex on the Beach","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["IBA","ContemporaryClassic"],"cost":[4.9,10.3],"img":"img/12754.jpg","ings":[{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"桃味利口酒/蜜桃酒","m":"3/4 oz","t":"酒","k":"peach-liqueur"},{"zh":"蔓越莓汁","m":"","t":"饮料","k":"cranberry-juice"},{"zh":"橙汁","m":"","t":"饮料","k":"orange-juice"}],"steps":["高球杯加满冰","伏特加、桃味利口酒、橙汁加冰摇和 8 秒后滤入","最后把蔓越莓汁沿杯壁缓缓倒入上层","橙片装饰"],"tip":"想分层就最后倒蔓越莓汁、不搅拌；想喝均匀就直接在杯里兑好搅一下，更省事。"},{"id":"11424","cn":"教母","en":"Godmother","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","ContemporaryClassic"],"cost":[6.1,12.7],"img":"img/11424.jpg","ings":[{"zh":"伏特加","m":"1 1/2 oz","t":"酒","k":"vodka"},{"zh":"杏仁利口酒","m":"3/4 oz","t":"酒","k":"amaretto"}],"steps":["将伏特加和杏仁利口酒倒在冰上，倒入古典杯中，即可享用。"],"tip":""},{"id":"11423","cn":"教父","en":"Godfather","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","ContemporaryClassic"],"cost":[8.2,17.1],"img":"img/11423.jpg","ings":[{"zh":"苏格兰威士忌","m":"1 1/2 oz","t":"酒","k":"scotch"},{"zh":"杏仁利口酒","m":"3/4 oz","t":"酒","k":"amaretto"}],"steps":["古典杯加大冰","倒入苏格兰威士忌","倒入杏仁利口酒","轻搅两圈即可"],"tip":"比例 3:1 是标准；喜欢杏仁味就 2:1。最不容易失败的一款，适合当第一杯练手。"},{"id":"12214","cn":"新加坡司令","en":"Singapore Sling","cat":"普通饮品","alc":"含酒精","glass":"Hurricane glass","tags":["IBA","ContemporaryClassic"],"cost":[4.2,8.2],"img":"img/12214.jpg","ings":[{"zh":"白兰地/干邑","m":"1/2 oz","t":"酒","k":"brandy"},{"zh":"石榴糖浆","m":"1/2 oz","t":"糖浆","k":"grenadine"},{"zh":"金酒","m":"1 oz","t":"酒","k":"gin"},{"zh":"酸甜汁","m":"2 oz","t":"饮料","k":"x:酸甜汁"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"},{"zh":"酒渍樱桃","m":"","t":"水果","k":"cherry"}],"steps":["除苏打外所有材料倒入摇壶，加冰摇和 12 秒","滤入装满冰的高球杯","（可选）补少量苏打水增加清爽度","菠萝片与樱桃装饰，插一根吸管"],"tip":"这是莱佛士酒店流传的常见版本，配方版本极多；廊酒和樱桃白兰地是区分真假的关键，别省。"},{"id":"11008","cn":"曼哈顿","en":"Manhattan","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic","Alcoholic"],"cost":[10.5,20.9],"img":"img/11008.jpg","ings":[{"zh":"甜味美思（红）","m":"3/4 oz","t":"酒","k":"sweet-vermouth"},{"zh":"波本威士忌","m":"2 1/2 oz Blended","t":"酒","k":"bourbon"},{"zh":"安高天娜苦精","m":"dash","t":"酒","k":"bitters"},{"zh":"冰块","m":"2 or 3","t":"其他","k":"ice"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"橙汁","m":"1 twist of","t":"饮料","k":"orange-juice"}],"steps":["鸡尾酒杯提前冰镇","三种材料倒入调酒杯加满冰","搅拌 20–25 秒","滤入冰镇杯中，放一颗樱桃"],"tip":"黑麦威士忌更有辛香骨架，波本更甜圆；味美思务必冷藏保存，否则会氧化变味。"},{"id":"14366","cn":"柠檬滴","en":"Lemon Drop","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","NewEra"],"cost":[18.7,34.5],"img":"img/14366.jpg","ings":[{"zh":"伏特加","m":"1 1/2 shot","t":"酒","k":"vodka"},{"zh":"君度/三重橙酒","m":"1 1/2 shot","t":"酒","k":"cointreau"},{"zh":"柠檬","m":"Juice of 1 wedge","t":"水果","k":"lemon"}],"steps":["摇和并滤入杯口沾糖的冰镇鸡尾酒杯中。"],"tip":""},{"id":"13020","cn":"桑格利亚","en":"Sangria","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Pitcher","tags":[],"cost":[481.1,964.1],"img":"img/13020.jpg","ings":[{"zh":"红葡萄酒","m":"1 bottle","t":"酒","k":"x:红葡萄酒"},{"zh":"糖浆","m":"1/2 cup","t":"糖浆","k":"syrup"},{"zh":"橙汁","m":"1 cup","t":"饮料","k":"orange-juice"},{"zh":"柠檬","m":"1 cup","t":"水果","k":"lemon"},{"zh":"肉豆蔻/肉桂粉","m":"","t":"调料","k":"nutmeg"},{"zh":"肉豆蔻/肉桂粉","m":"","t":"调料","k":"nutmeg"}],"steps":["将所有配料放入大水壶中混合并冷藏。按口味加入丁香和肉桂棒。盛入葡萄酒杯中享用。"],"tip":""},{"id":"17207","cn":"椰林飘香","en":"Pina Colada","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","ContemporaryClassic"],"cost":[10.6,20.1],"img":"img/17207.jpg","ings":[{"zh":"白朗姆","m":"3 oz","t":"酒","k":"white-rum"},{"zh":"椰浆/椰奶","m":"3 tblsp","t":"饮料","k":"coconut-cream"},{"zh":"菠萝汁","m":"3 tblsp","t":"饮料","k":"pineapple-juice"}],"steps":["三种液体倒入摇壶，加碎冰","用力摇和 12 秒（或用料理机打成冰沙）","倒入飓风杯","菠萝片与樱桃装饰，插吸管"],"tip":"用料理机打成冰沙口感最好；椰浆要用浓稠的那种，不要用椰子水（味道太淡）。"},{"id":"12402","cn":"汤姆柯林斯","en":"Tom Collins","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":[],"cost":[60.9,122.0],"img":"img/12402.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"柠檬","m":"1 oz","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 tsp superfine","t":"糖浆","k":"syrup"},{"zh":"苏打水","m":"3 oz","t":"饮料","k":"soda"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"橙汁","m":"1","t":"饮料","k":"orange-juice"}],"steps":["金酒、柠檬汁、糖浆倒入摇壶加冰摇和 10 秒","滤入装满冰的高球杯","补满冰镇苏打水，轻搅两下","柠檬片与樱桃装饰"],"tip":"摇和之后再兑苏打，气泡更持久。用老汤姆金酒风味更传统，没有就用普通金酒。"},{"id":"17216","cn":"汤米玛格丽特","en":"Tommy's Margarita","cat":"普通饮品","alc":"含酒精","glass":"Old-Fashioned glass","tags":["IBA","NewEra"],"cost":[27.9,55.8],"img":"img/17216.jpg","ings":[{"zh":"龙舌兰（银标）","m":"4.5 cl","t":"酒","k":"tequila"},{"zh":"青柠","m":" lass":"Collins glass","tags":[],"cost":[4.4,10.1],"img":"img/17252.jpg","ings":[{"zh":"伏特加","m":"1 1/2 oz","t":"酒","k":"vodka"},{"zh":"西柚汽水/西柚汁","m":"3 oz","t":"饮料","k":"grapefruit-soda"}],"steps":["将伏特加倒入装满冰的柯林杯中。补满西柚汁并搅拌。"],"tip":""},{"id":"178345","cn":"热托蒂","en":"Hot Toddy","cat":"鸡尾酒","alc":"含酒精","glass":"Irish coffee cup","tags":["Winter"],"cost":[7.6,15.6],"img":"img/178345.jpg","ings":[{"zh":"波本威士忌","m":"50 ml","t":"酒","k":"bourbon"},{"zh":"蜂蜜","m":"15 ml","t":"糖浆","k":"x:蜂蜜"},{"zh":"肉豆蔻/肉桂粉","m":"1","t":"调料","k":"nutmeg"},{"zh":"柠檬","m":"1","t":"水果","k":"lemon"},{"zh":"肉豆蔻/肉桂粉","m":"2","t":"调料","k":"nutmeg"}],"steps":["第1步 将威士忌与蜂蜜搅打均匀，分装入2只耐热杯中。每杯放入半根肉桂棒，然后补满200毫升沸水。 第2步 每杯滴入少许柠檬汁，随后品尝并按个人口味再加一些。每杯最后以一片柠檬装饰，柠檬片上扎入一颗丁香，立即饮用。"],"tip":""},{"id":"12988","cn":"热红酒","en":"Mulled Wine","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Collins Glass","tags":["Christmas"],"cost":[26.2,57.2],"img":"img/12988.jpg","ings":[{"zh":"水","m":"3 cups","t":"饮料","k":"x:水"},{"zh":"糖浆","m":"1 cup","t":"糖浆","k":"syrup"},{"zh":"肉豆蔻/肉桂粉","m":"12","t":"调料","k":"nutmeg"},{"zh":"肉豆蔻/肉桂粉","m":"2","t":"调料","k":"nutmeg"},{"zh":"柠檬","m":"1","t":"水果","k":"lemon"},{"zh":"红葡萄酒","m":"750 ml","t":"酒","k":"x:红葡萄酒"},{"zh":"白兰地/干邑","m":"1/4 cup","t":"酒","k":"brandy"}],"steps":["在不锈钢锅中将 3 杯水与糖、丁香、肉桂棒和柠檬皮微沸 10 分钟。加入葡萄酒加热至咖啡的温度（切勿煮沸），再加入白兰地。"],"tip":""},{"id":"13971","cn":"爱尔兰咖啡","en":"Irish Coffee","cat":"咖啡/茶","alc":"含酒精","glass":"Irish coffee cup","tags":["IBA","ContemporaryClassic"],"cost":[22.1,60.2],"img":"img/13971.jpg","ings":[{"zh":"波本威士忌","m":"1 1/2 oz","t":"酒","k":"bourbon"},{"zh":"浓缩咖啡","m":"8 oz","t":"饮料","k":"espresso"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"淡奶油/牛奶","m":"1 tblsp","t":"饮料","k":"cream"}],"steps":["杯子先用热水烫热，倒掉水","放入方糖，倒入热浓缩咖啡搅至融化","加入爱尔兰威士忌","淡奶油轻打至微稠（能流动），沿勺背缓缓倒在表面形成浮层"],"tip":"奶油要「微稠」而不是打发：太硬会沉不下去也浮不漂亮。喝的时候不要搅拌，透过奶油喝。"},{"id":"17189","cn":"猴腺","en":"Monkey Gland","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic"],"cost":[1.8,3.1],"img":"img/17189.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"廊酒 Bénédictine","m":"1 tsp","t":"酒","k":"benedictine"},{"zh":"橙汁","m":"1/2 oz","t":"饮料","k":"orange-juice"},{"zh":"石榴糖浆","m":"1 tsp","t":"糖浆","k":"grenadine"}],"steps":["加冰块在摇壶中充分摇和，滤入冰镇的鸡尾酒杯。"],"tip":""},{"id":"11007","cn":"玛格丽特","en":"Margarita","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","ContemporaryClassic"],"cost":[52.2,103.4],"img":"img/11007.jpg","ings":[{"zh":"龙舌兰（银标）","m":"1 1/2 oz","t":"酒","k":"tequila"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"青柠","m":"1 oz","t":"水果","k":"lime"},{"zh":"盐","m":"","t":"调料","k":"salt"}],"steps":["用青柠角擦湿杯口，把杯口半圈蘸上细盐","三种材料倒入摇壶加满冰，摇和 12 秒","双重过滤滤入杯中（滤掉冰渣）","青柠片装饰"],"tip":"盐边只做半圈，喝的人可以自己选边喝。喜欢更清爽可以用「番茄玛格丽特」的思路加一点西柚汁。"},{"id":"12101","cn":"生锈钉","en":"Rusty Nail","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","Classic"],"cost":[5.7,12.7],"img":"img/12101.jpg","ings":[{"zh":"苏格兰威士忌","m":"1 1/2 oz","t":"酒","k":"scotch"},{"zh":"Drambuie","m":"1/2 oz","t":"","k":"x:Drambuie"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["将苏格兰威士忌和 Drambuie 倒入几乎装满冰块的古典杯中，充分搅拌，装饰柠檬皮卷。"],"tip":""},{"id":"12528","cn":"白俄","en":"White Russian","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[8.5,17.4],"img":"img/12528.jpg","ings":[{"zh":"伏特加","m":"2 oz","t":"酒","k":"vodka"},{"zh":"咖啡利口酒","m":"1 oz","t":"酒","k":"coffee-liqueur"},{"zh":"淡奶油/牛奶","m":"","t":"饮料","k":"cream"}],"steps":["古典杯加方冰","倒入伏特加与咖啡利口酒，轻搅","把淡奶油沿勺背缓缓倒在上层","不要搅拌，端上桌时是三层"],"tip":"《谋杀绿脚趾》里那杯就是它。奶油要冷藏且新鲜，太稀会瞬间混在一起。"},{"id":"11014","cn":"白兰地亚历山大","en":"Alexander","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic","Dairy"],"cost":[4.7,9.1],"img":"img/11014.jpg","ings":[{"zh":"金酒","m":"1/2 oz","t":"酒","k":"gin"},{"zh":"可可利口酒","m":"1/2 oz white","t":"酒","k":"cocoa-liqueur"},{"zh":"淡奶油/牛奶","m":"2 oz","t":"饮料","k":"cream"},{"zh":"肉豆蔻/肉桂粉","m":"","t":"调料","k":"nutmeg"}],"steps":["三种材料等份倒入摇壶加满冰","用力摇和 12 秒（让奶油充分融合）","双重过滤滤入冰镇杯中","表面撒少许肉豆蔻粉"],"tip":"甜点型鸡尾酒，三种等份最好记。做给不爱烈酒的人喝，成功率极高。"},{"id":"17194","cn":"白色佳人","en":"White Lady","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic"],"cost":[45.1,88.1],"img":"img/17194.jpg","ings":[{"zh":"金酒","m":"4cl","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"3cl","t":"酒","k":"cointreau"},{"zh":"柠檬","m":"2cl","t":"水果","k":"lemon"}],"steps":["将全部原料放入装有冰块的鸡尾酒摇壶中。充分摇和，滤入大号鸡尾酒杯。"],"tip":""},{"id":"13837","cn":"皇家基尔","en":"Kir Royale","cat":"普通饮品","alc":"含酒精","glass":"Champagne Flute","tags":[],"cost":[12.0,30.0],"img":"img/13837.jpg","ings":[{"zh":"黑醋栗奶油","m":"1 part","t":"调料","k":"x:黑醋栗奶油"},{"zh":"起泡酒/香槟","m":"5 parts","t":"酒","k":"sparkling"}],"steps":["将黑加仑利口酒倒入杯中，轻轻将香槟倒在上面"],"tip":""},{"id":"13214","cn":"皮斯科酸","en":"Pisco Sour","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","NewEra"],"cost":[60.5,121.4],"img":"img/13214.jpg","ings":[{"zh":"皮斯科","m":"2 oz","t":"","k":"x:皮斯科"},{"zh":"柠檬","m":"1 oz","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1-2 tblsp","t":"糖浆","k":"syrup"},{"zh":"冰块","m":"1","t":"其他","k":"ice"},{"zh":"蛋白","m":"","t":"其他","k":"egg-white"}],"steps":["在加有冰块的鸡尾酒摇壶中用力摇和并滤出内容物，然后倒入杯中，以苦精装饰。"],"tip":""},{"id":"17829","cn":"盘尼西林","en":"Penicillin","cat":"鸡尾酒","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[53.0,107.9],"img":"img/17829.jpg","ings":[{"zh":"苏格兰威士忌","m":"2 oz","t":"酒","k":"scotch"},{"zh":"柠檬","m":"3/4 oz","t":"水果","k":"lemon"},{"zh":"蜂蜜糖浆","m":"2 tsp","t":"糖浆","k":"syrup"},{"zh":"姜汁啤酒/干姜水","m":"2 tsp","t":"饮料","k":"ginger-beer"},{"zh":"苏格兰威士忌","m":"1/4 oz","t":"酒","k":"scotch"}],"steps":["将调和苏格兰威士忌、柠檬汁、蜂蜜糖浆和姜糖浆加冰摇和，滤入放有大冰块的冰镇古典杯中，在表面漂浮烟熏苏格兰威士忌（务必使用艾雷岛单一麦芽等烟熏苏格兰威士忌），用糖姜作装饰。"],"tip":""},{"id":"11600","cn":"神风特攻","en":"Kamikaze","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","NewEra"],"cost":[51.8,102.3],"img":"img/11600.jpg","ings":[{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"君度/三重橙酒","m":"1 oz","t":"酒","k":"cointreau"},{"zh":"青柠","m":"1 oz","t":"水果","k":"lime"}],"steps":["将所有配料加冰一起摇和。滤入杯中，装饰即可饮用。"],"tip":""},{"id":"178343","cn":"米切拉达","en":"Michelada","cat":"鸡尾酒","alc":"含酒精","glass":"Pint glass","tags":["Hangover","StrongFlavor","Breakfast"],"cost":[3.0,6.2],"img":"img/178343.jpg","ings":[{"zh":"啤酒","m":"4 oz","t":"饮料","k":"ginger-beer"},{"zh":"番茄汁","m":"4 oz","t":"饮料","k":"tomato-juice"},{"zh":"青柠","m":"1 tblsp","t":"水果","k":"lime"},{"zh":"塔巴斯科辣酱","m":"Dash","t":"调料","k":"tabasco"},{"zh":"伍斯特酱","m":"Dash","t":"调料","k":"worcestershire"},{"zh":"酱油","m":"Dash","t":"调料","k":"x:酱油"}],"steps":["将啤酒与番茄汁、鲜榨青柠汁，以及伍斯特酱、照烧酱、酱油或辣酱混合。盛入冰镇的盐边杯中"],"tip":""},{"id":"11938","cn":"粉红佳人","en":"Pink Lady","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[1.6,3.1],"img":"img/11938.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"石榴糖浆","m":"1 tsp","t":"糖浆","k":"grenadine"},{"zh":"淡奶油/牛奶","m":"1 tsp","t":"饮料","k":"cream"},{"zh":"蛋白","m":"1","t":"其他","k":"egg-white"}],"steps":["将所有配料加冰摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"11936","cn":"粉红金酒","en":"Pink Gin","cat":"普通饮品","alc":"含酒精","glass":"White wine glass","tags":[],"cost":[0.7,1.2],"img":"img/11936.jpg","ings":[{"zh":"安高天娜苦精","m":"3 dashes","t":"酒","k":"bitters"},{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"}],"steps":["将苦精倒入葡萄酒杯，旋转杯身使苦精均匀覆盖杯内壁，甩出多余的苦精。将金酒倒入杯中，不要加冰。"],"tip":""},{"id":"11580","cn":"约翰柯林斯","en":"John Collins","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA"],"cost":[67.2,134.7],"img":"img/11580.jpg","ings":[{"zh":"波本威士忌","m":"2 oz","t":"酒","k":"bourbon"},{"zh":"柠檬","m":"1 oz","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 tsp superfine","t":"糖浆","k":"syrup"},{"zh":"苏打水","m":"3 oz","t":"饮料","k":"soda"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"橙汁","m":"1","t":"饮料","k":"orange-juice"}],"steps":["将所有原料直接倒入装满冰的高球杯。轻轻搅拌。装饰。加入一滴安哥斯图拉苦精。"],"tip":""},{"id":"17218","cn":"维斯帕","en":"Vesper","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","NewEra"],"cost":[1.2,2.8],"img":"img/17218.jpg","ings":[{"zh":"金酒","m":"6 cl","t":"酒","k":"gin"},{"zh":"伏特加","m":"1.5 cl","t":"酒","k":"vodka"},{"zh":"利莱酒布兰科","m":"0.75 cl","t":"","k":"x:利莱酒布兰科"}],"steps":["加冰摇和至充分冰镇，然后滤入深口高脚杯中，用一片薄柠檬皮装饰。"],"tip":""},{"id":"15941","cn":"美国佬","en":"Americano","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","Classic"],"cost":[7.4,11.7],"img":"img/15941.jpg","ings":[{"zh":"金巴利","m":"1 oz","t":"酒","k":"campari"},{"zh":"甜味美思（红）","m":"1 oz red","t":"酒","k":"sweet-vermouth"},{"zh":"柠檬","m":"Twist of","t":"水果","k":"lemon"},{"zh":"橙汁","m":"Twist of","t":"饮料","k":"orange-juice"}],"steps":["古典杯加大冰","倒入金巴利与甜味美思","注入苏打水，轻搅","橙皮挤油后装饰"],"tip":"内格罗尼的「有气」版本（把金酒换成了苏打水），度数低很多，适合饭前开胃。"},{"id":"17827","cn":"老友","en":"Old Pal","cat":"鸡尾酒","alc":"含酒精","glass":"Nick and Nora Glass","tags":[],"cost":[16.9,32.2],"img":"img/17827.jpg","ings":[{"zh":"黑麦威士忌","m":"2 oz","t":"酒","k":"rye"},{"zh":"金巴利","m":"1 oz","t":"酒","k":"campari"},{"zh":"干味美思（白）","m":"1 oz","t":"酒","k":"dry-vermouth"}],"steps":["冰镇鸡尾酒杯。将材料加入搅拌杯，加冰至三分之二满。搅拌约20秒。倒空鸡尾酒杯，将酒液滤入杯中。以一片拧过的柠檬皮装饰。"],"tip":""},{"id":"17181","cn":"脏马天尼","en":"Dirty Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","NewEra"],"cost":[18.0,37.5],"img":"img/17181.jpg","ings":[{"zh":"伏特加","m":"70ml/2fl oz","t":"酒","k":"vodka"},{"zh":"干味美思（白）","m":"1 tbsp","t":"酒","k":"dry-vermouth"},{"zh":"青橄榄","m":"2 tbsp","t":"植物材料","k":"olive"},{"zh":"柠檬","m":"1 wedge","t":"水果","k":"lemon"},{"zh":"青橄榄","m":"1","t":"植物材料","k":"olive"}],"steps":["将伏特加、干味美思和橄榄汁倒入装有少量冰块的鸡尾酒摇壶中，充分摇和。用柠檬角擦拭马天尼杯的杯口。将摇壶中的内容物滤入杯中，并加入橄榄。脏马天尼含有少量橄榄汁或橄榄盐水，通常用橄榄装饰。"],"tip":""},{"id":"11288","cn":"自由古巴","en":"Cuba Libre","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["IBA","ContemporaryClassic"],"cost":[5.5,10.2],"img":"img/11288.jpg","ings":[{"zh":"白朗姆","m":"2 oz","t":"酒","k":"white-rum"},{"zh":"青柠","m":"Juice of 1/2","t":"水果","k":"lime"},{"zh":"可乐","m":"","t":"饮料","k":"cola"}],"steps":["高球杯加满冰","倒入白朗姆","挤入半个青柠的汁，青柠角丢进杯中","注入冰镇可乐，轻搅一下"],"tip":"先挤青柠再倒可乐，味道完全不同。用墨西哥可乐（蔗糖版）会更香。"},{"id":"17210","cn":"荆棘","en":"Bramble","cat":"普通饮品","alc":"含酒精","glass":"Old-Fashioned glass","tags":["IBA","NewEra"],"cost":[30.4,61.0],"img":"img/17210.jpg","ings":[{"zh":"金酒","m":"4 cl","t":"酒","k":"gin"},{"zh":"柠檬","m":"1.5 cl","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 cl","t":"糖浆","k":"syrup"},{"zh":"黑莓利口酒","m":"1.5 cl","t":"酒","k":"x:黑莓利口酒"}],"steps":["在杯中装满碎冰。依次加入金酒、柠檬汁和糖浆。搅拌，然后将黑莓利口酒以画圈方式淋在其上，营造大理石纹效果。以两颗黑莓和一片柠檬装饰。"],"tip":""},{"id":"11000","cn":"莫吉托","en":"Mojito","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":["IBA","ContemporaryClassic","Alcoholic","USA","Asia","Vegan","Citrus","Brunch","Hangover","Mild"],"cost":[19.0,37.0],"img":"img/11000.jpg","ings":[{"zh":"白朗姆","m":"2-3 oz","t":"酒","k":"white-rum"},{"zh":"青柠","m":"Juice of 1","t":"水果","k":"lime"},{"zh":"糖浆","m":"2 tsp","t":"糖浆","k":"syrup"},{"zh":"薄荷","m":"2-4","t":"植物材料","k":"mint"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"}],"steps":["薄荷叶与糖浆、青柠汁放入杯底，用捣棒轻压 3–4 下（只压出香气，别捣烂）","倒入白朗姆，加半杯碎冰搅匀","补满碎冰，注入苏打水","插薄荷枝与青柠角，插吸管"],"tip":"薄荷千万别捣碎，碎叶会释放叶绿素带来苦味。杯子一定要冰透，碎冰化得快，喝的就是那个冰爽。"},{"id":"11009","cn":"莫斯科骡子","en":"Moscow Mule","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Copper Mug","tags":["IBA","ContemporaryClassic"],"cost":[95.8,193.2],"img":"img/11009.jpg","ings":[{"zh":"伏特加","m":"2 oz","t":"酒","k":"vodka"},{"zh":"青柠","m":"2 oz","t":"水果","k":"lime"},{"zh":"姜汁啤酒/干姜水","m":"8 oz","t":"饮料","k":"ginger-beer"}],"steps":["铜杯加满冰","倒入伏特加与青柠汁","注入冰镇姜汁啤酒，轻搅","青柠片装饰"],"tip":"铜杯是灵魂：导热快，能让酒一直保持冰凉，握在手里的手感也是体验的一部分。"},{"id":"12127","cn":"萨泽拉克","en":"Sazerac","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":["IBA","Classic"],"cost":[6.9,13.7],"img":"img/12127.jpg","ings":[{"zh":"里卡德","m":"1 tsp","t":"","k":"x:里卡德"},{"zh":"糖浆","m":"1/2 tsp superfine","t":"糖浆","k":"syrup"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"水","m":"1 tsp","t":"饮料","k":"x:水"},{"zh":"波本威士忌","m":"2 oz","t":"酒","k":"bourbon"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["古典杯里倒入少量苦艾酒，转动让内壁挂满，多余的倒掉","另取调酒杯放方糖，滴入苦精与几滴水，压碎搅至融化","加入白兰地与冰，搅拌 25 秒","滤入挂过苦艾酒的杯中（不加冰）","柠檬皮挤油后擦拭杯口，可投入或丢弃"],"tip":"新奥尔良的招牌。传统用黑麦威士忌，也有用干邑的版本；苦艾酒只用来「洗杯」，多了会毁掉整杯。"},{"id":"17828","cn":"蒂珀雷里","en":"Tipperary","cat":"鸡尾酒","alc":"含酒精","glass":"Nick and Nora Glass","tags":[],"cost":[8.7,16.8],"img":"img/17828.jpg","ings":[{"zh":"波本威士忌","m":"2 oz","t":"酒","k":"bourbon"},{"zh":"甜味美思（红）","m":"1 oz","t":"酒","k":"sweet-vermouth"},{"zh":"绿色黄绿色","m":"1/2 oz","t":"","k":"x:绿色黄绿色"}],"steps":["加冰搅拌。滤入冰镇的酒杯。切一片宽大的橙皮，在饮品上方挤压释放橙油。弃去橙皮卷。"],"tip":""},{"id":"11120","cn":"蓝鸟","en":"Bluebird","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[4.8,8.5],"img":"img/11120.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"蓝橙力娇酒","m":"1/2 oz","t":"酒","k":"blue-curacao"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["在装半杯碎冰的调酒杯中，加入金酒、白橙皮酒、库拉索酒和苦精，充分搅拌，滤入鸡尾酒杯，用柠檬皮扭条和樱桃装饰。"],"tip":""},{"id":"17206","cn":"薄荷朱莉普","en":"Mint Julep","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","ContemporaryClassic"],"cost":[28.1,56.3],"img":"img/17206.jpg","ings":[{"zh":"薄荷","m":"4 fresh","t":"植物材料","k":"mint"},{"zh":"波本威士忌","m":"2 1/2 oz","t":"酒","k":"bourbon"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"水","m":"2 tsp","t":"饮料","k":"x:水"}],"steps":["在高球杯中轻轻搅拌薄荷、糖和水。在玻璃杯中倒入碎冰，加入波旁威士忌，充分搅拌，直到玻璃杯完全磨砂。用薄荷枝装饰。"],"tip":""},{"id":"17200","cn":"蚱蜢","en":"Grasshopper","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","ContemporaryClassic","Halloween"],"cost":[3.9,7.0],"img":"img/17200.jpg","ings":[{"zh":"绿色薄荷甜酒","m":"3/4 oz","t":"植物材料","k":"mint"},{"zh":"可可利口酒","m":"3/4 oz white","t":"酒","k":"cocoa-liqueur"},{"zh":"淡奶油/牛奶","m":"3/4 oz","t":"饮料","k":"cream"}],"steps":["将配料倒入加冰的鸡尾酒摇壶中。快速摇和后滤入冰镇的鸡尾酒杯中。"],"tip":""},{"id":"12162","cn":"螺丝起子","en":"Screwdriver","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["IBA"],"cost":[4.7,11.0],"img":"img/12162.jpg","ings":[{"zh":"伏特加","m":"2 oz","t":"酒","k":"vodka"},{"zh":"橙汁","m":"","t":"饮料","k":"orange-juice"}],"steps":["高球杯加满冰","倒入伏特加","注入橙汁，搅匀","橙片装饰"],"tip":"只有两种材料，成败全在橙汁：一定用鲜榨，瓶装橙汁做出来是两种饮料。"},{"id":"17195","cn":"贝里尼","en":"Bellini","cat":"普通饮品","alc":"含酒精","glass":"Champagne Flute","tags":["ContemporaryClassic","IBA"],"cost":[17.6,41.8],"img":"img/17195.jpg","ings":[{"zh":"起泡酒/香槟","m":"6 oz","t":"酒","k":"sparkling"},{"zh":"桃味利口酒/蜜桃酒","m":"1 oz","t":"酒","k":"peach-liqueur"}],"steps":["白桃泥与起泡酒都提前冷藏","先把白桃泥倒入香槟杯","沿杯壁缓缓注入起泡酒","轻轻搅一下即可"],"tip":"威尼斯经典的早午餐酒。用新鲜白桃打成泥最好，罐头桃泥也行；起泡酒用干型（Brut）更平衡。"},{"id":"17185","cn":"赌场","en":"Casino","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA"],"cost":[3.6,7.3],"img":"img/17185.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"樱桃白兰地/樱桃酒","m":"1/4 tsp","t":"酒","k":"cherry-brandy"},{"zh":"柠檬","m":"1/4 tsp","t":"水果","k":"lemon"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["将所有配料倒入装有冰块的摇酒壶中。充分摇和。滤入冰镇的鸡尾酒杯。以柠檬皮扭条和酒渍马拉斯奇诺樱桃装饰。不加吸管饮用。"],"tip":""},{"id":"12196","cn":"边车","en":"Sidecar","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic"],"cost":[74.4,147.6],"img":"img/12196.jpg","ings":[{"zh":"白兰地/干邑","m":"2 oz","t":"酒","k":"brandy"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"柠檬","m":"1 oz","t":"水果","k":"lemon"}],"steps":["杯口可蘸一圈细砂糖（可选）","三种材料加冰摇和 12 秒","双重过滤滤入杯中","柠檬皮挤油后装饰"],"tip":"经典比例 2:1:1（白兰地:君度:柠檬）。第一次世界大战的巴黎酒吧发明，名字来自军官乘坐的边车。"},{"id":"11690","cn":"迈泰","en":"Mai Tai","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","ContemporaryClassic"],"cost":[6.7,11.7],"img":"img/11690.jpg","ings":[{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"},{"zh":"杏仁糖浆 Orgeat","m":"1/2 oz","t":"糖浆","k":"almond-syrup"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"酸甜汁","m":"1 1/2 oz","t":"饮料","k":"x:酸甜汁"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["除黑朗姆外全部倒入摇壶加冰摇和 12 秒","倒入装了碎冰的古典杯","把黑朗姆沿杯壁缓缓浮在最上层","薄荷枝与菠萝片装饰"],"tip":"关键在杏仁糖浆（Orgeat），没有它就不是迈泰。黑朗姆最后「float」上去，视觉和香气都更好。"},{"id":"178365","cn":"金汤力","en":"Gin Tonic","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[3.0,6.2],"img":"img/178365.jpg","ings":[{"zh":"金酒","m":"4 cl","t":"酒","k":"gin"},{"zh":"汤力水","m":"10 cl","t":"饮料","k":"tonic"},{"zh":"柠檬","m":"1 Slice","t":"水果","k":"lemon"},{"zh":"冰块","m":"cubes","t":"其他","k":"ice"}],"steps":["高球杯加满冰块，先把冰搅动几下让杯壁降温","倒入金酒，轻轻搅两圈","沿吧勺缓缓注入冰镇汤力水（减少气泡流失）","挤半个青柠的汁进去，青柠角留在杯口或丢进杯中"],"tip":"汤力水越冰越好，最后倒、轻搅、别猛摇；想更好喝可以加一枝迷迭香或几片黄瓜。"},{"id":"11410","cn":"金菲士","en":"Gin Fizz","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["IBA","Classic"],"cost":[1.2,2.5],"img":"img/11410.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"}],"steps":["金酒、柠檬汁、糖浆、蛋白倒入摇壶（先不加冰）干摇 10 秒","加冰再摇 12 秒，摇出绵密泡沫","滤入高球杯（可不加冰）","补入苏打水，泡沫会浮在表面"],"tip":"「干摇 + 冰摇」是蛋白类鸡尾酒的标准手法；不吃生蛋可用鹰嘴豆水（aquafaba）替代。"},{"id":"11002","cn":"长岛冰茶","en":"Long Island Tea","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["Strong","Asia","StrongFlavor","Brunch","Vegetarian","Sour"],"cost":[5.2,10.6],"img":"img/11002.jpg","ings":[{"zh":"伏特加","m":"1/2 oz","t":"酒","k":"vodka"},{"zh":"白朗姆","m":"1/2 oz","t":"酒","k":"white-rum"},{"zh":"金酒","m":"1/2 oz","t":"酒","k":"gin"},{"zh":"龙舌兰（银标）","m":"1/2 oz","t":"酒","k":"tequila"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"可乐","m":"1 splash","t":"饮料","k":"cola"}],"steps":["五种基酒与利口酒、柠檬汁、糖浆倒入摇壶加冰摇和 10 秒","滤入装满冰的高球杯","补入可乐至八分满，轻搅","柠檬片装饰"],"tip":"⚠️ 名字像饮料，实际含五种烈酒，酒精度约 20% 以上。别用大杯猛灌，很容易喝断片。"},{"id":"17204","cn":"长岛冰茶","en":"Long Island Iced Tea","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":["IBA","ContemporaryClassic"],"cost":[4.1,8.5],"img":"img/17204.jpg","ings":[{"zh":"伏特加","m":"1/2 oz","t":"酒","k":"vodka"},{"zh":"龙舌兰（银标）","m":"1/2 oz","t":"酒","k":"tequila"},{"zh":"白朗姆","m":"1/2 oz","t":"酒","k":"white-rum"},{"zh":"金酒","m":"1/2 oz","t" 吸干，去除多余油脂。将果皮放入 4 杯容量的螺旋盖罐中。加入 2 杯伏特加。盖紧罐子。置于阴凉避光处存放 2 天，或直至伏特加吸收其风味。取出果皮，加入剩余的伏特加。盖紧罐子，再加入剩余 1 杯伏特加。盖紧罐子，置于阴凉避光处陈化至少 1 个月。"],"tip":""},{"id":"11222","cn":"卡萨布兰卡","en":"Casa Blanca","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[18.4,35.0],"img":"img/11222.jpg","ings":[{"zh":"白朗姆","m":"2 oz","t":"酒","k":"white-rum"},{"zh":"君度/三重橙酒","m":"1 1/2 tsp","t":"酒","k":"cointreau"},{"zh":"青柠","m":"1 1/2 tsp","t":"水果","k":"lime"},{"zh":"樱桃白兰地/樱桃酒","m":"1 1/2 tsp","t":"酒","k":"cherry-brandy"}],"steps":["将所有配料加冰摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"11224","cn":"皇家赌场","en":"Casino Royale","cat":"普通饮品","alc":"含酒精","glass":"Whiskey sour glass","tags":[],"cost":[31.7,63.0],"img":"img/11224.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"柠檬","m":"1/2 oz","t":"水果","k":"lemon"},{"zh":"樱桃白兰地/樱桃酒","m":"1 tsp","t":"酒","k":"cherry-brandy"},{"zh":"安高天娜苦精","m":"1 dash","t":"酒","k":"bitters"},{"zh":"蛋白","m":"1","t":"其他","k":"egg-white"}],"steps":["在装有半杯冰块儿的摇酒壶中，加入所有配料。充分摇和。滤入酸酒杯。"],"tip":""},{"id":"12730","cn":"卡斯蒂利亚热巧克力","en":"Castillian Hot Chocolate","cat":"可可饮品","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[11.6,26.6],"img":"img/12730.jpg","ings":[{"zh":"Cocoa powder","m":"1/2 cup","t":"","k":"x:Cocoa powder"},{"zh":"糖浆","m":"1 cup","t":"糖浆","k":"syrup"},{"zh":"玉米淀粉","m":"7 tsp","t":"","k":"x:玉米淀粉"},{"zh":"水","m":"1/2 cup","t":"饮料","k":"x:水"},{"zh":"淡奶油/牛奶","m":"1 qt","t":"饮料","k":"cream"}],"steps":["将可可粉与糖一同筛入中型平底锅中。用水将玉米淀粉化开，搅拌加入可可粉与糖中，直至成为顺滑的糊状。开始加热混合物，用打蛋器搅拌，并逐渐倒入牛奶。继续用打蛋器搅拌，将液体煮至微沸。让巧克力微沸约 10 分钟，经常搅拌，直至浓稠、光亮且完全顺滑。盛入咖啡杯，趁热冒汽时享用。六人份。"],"tip":""},{"id":"11227","cn":"香槟鸡尾酒","en":"Champagne Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Champagne flute","tags":["IBA","ContemporaryClassic"],"cost":[0.6,1.1],"img":"img/11227.jpg","ings":[{"zh":"起泡酒/香槟","m":"Chilled","t":"酒","k":"sparkling"},{"zh":"糖浆","m":"1 piece","t":"糖浆","k":"syrup"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"},{"zh":"白兰地/干邑","m":" 层锅的底部，加入鸡蛋，不断搅拌，直到它们完全混合，混合物起泡沫。装在咖啡杯里。八。"],"tip":""},{"id":"11243","cn":"巧克力黑俄罗斯","en":"Chocolate Black Russian","cat":"普通饮品","alc":"含酒精","glass":"Champagne flute","tags":[],"cost":[6.3,11.3],"img":"img/11243.jpg","ings":[{"zh":"咖啡利口酒","m":"1 oz","t":"酒","k":"coffee-liqueur"},{"zh":"伏特加","m":"1/2 oz","t":"酒","k":"vodka"},{"zh":"可乐","m":"5 oz","t":"饮料","k":"cola"}],"steps":["将所有材料放入电动搅拌机，以低速搅打片刻。倒入冰镇的香槟笛形杯，出品。"],"tip":""},{"id":"12734","cn":"巧克力饮料","en":"Chocolate Drink","cat":"可可饮品","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[69.3,130.4],"img":"img/12734.jpg","ings":[{"zh":"可乐","m":"125 gr","t":"饮料","k":"cola"},{"zh":"淡奶油/牛奶","m":"3/4 L","t":"饮料","k":"cream"},{"zh":"水","m":"","t":"饮料","k":"x:水"}],"steps":["用少量沸水将巧克力块化开。加入牛奶。小火加热，轻轻搅打（我想是用打蛋器），直至充分热透。不要让它煮沸！倒入咖啡杯上桌。"],"tip":""},{"id":"13328","cn":"巧克力牛奶","en":"Chocolate Milk","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot Glass","tags":[],"cost":[1.3,2.7],"img":"img/13328.jpg","ings":[{"zh":"可乐","m":"1/2 shot","t":"饮料","k":"cola"},{"zh":"淡奶油/牛奶","m":"1/2 shot","t":"饮料","k":"cream"},{"zh":"杏仁利口酒","m":"1 dash","t":"酒","k":"amaretto"}],"steps":["将牛奶倒在杯底，把利口酒倒在上面，再滴入几滴杏仁利口酒。不要搅匀。一口闷掉！"],"tip":""},{"id":"15615","cn":"巧克力猴子","en":"Chocolate Monkey","cat":"奶昔","alc":"可含可不含","glass":"Parfait glass","tags":[],"cost":[11.4,19.9],"img":"img/15615.jpg","ings":[{"zh":"香蕉利口酒","m":"1 shot","t":"酒","k":"x:香蕉利口酒"},{"zh":"可可利口酒","m":"2 shots","t":"酒","k":"cocoa-liqueur"},{"zh":"可乐","m":"2 scoops","t":"饮料","k":"cola"},{"zh":"可乐","m":"1 oz","t":"饮料","k":"cola"},{"zh":"可乐","m":"4 oz","t":"饮料","k":"cola"},{"zh":"淡奶油/牛奶","m":"1","t":"饮料","k":"cream"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"香蕉","m":"1 piece","t":"水果","k":"x:香蕉"}],"steps":["将利口酒与冰淇淋、牛奶和糖浆一起搅打。倒入帕菲杯中，顶部加上打发的奶油，并以香蕉和樱桃装饰。"],"tip":""},{"id":"17135","cn":"柑橘可口可乐","en":"Citrus Coke","cat":"软饮","alc":"含酒精","glass":"Highball Glass","tags":[],"cost":[0.5,0.9],"img":"img/17135.jpg","ings":[{"zh":"巴卡第利","m":"1 part","t":"","k":"x:巴卡第利"},{"zh":"可乐","m":"2 parts","t":"饮料","k":"cola"}],"steps":["将一半可乐倒入杯中。然后加入百加得朗姆酒，再以剩余可乐补满。搅拌后一饮而尽！"],"tip":""},{"id":"11251","cn":"城里人","en":"City Slicker","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[17.2,33.4],"img":"img/11251.jpg","ings":[{"zh":"白兰地/干邑","m":"2 oz","t":"酒","k":"brandy"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"柠檬","m":"1 tblsp","t":"水果","k":"lemon"}],"steps":["在装有半杯冰块儿的摇酒壶中，加入所有配料。充分摇和。滤入鸡尾酒杯。"],"tip":""},{"id":"11145","cn":"经典老式鸡尾酒","en":"Classic Old-Fashioned","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[12.3,25.0],"img":"img/11145.jpg","ings":[{"zh":"安高天娜苦精","m":"3 dashes","t":"酒","k":"bitters"},{"zh":"水","m":"1 tsp","t":"饮料","k":"x:水"},{"zh":"糖浆","m":"1","t":"糖浆","k":"syrup"},{"zh":"波本威士忌","m":"3 oz","t":"酒","k":"bourbon"},{"zh":"橙汁","m":"1","t":"饮料","k":"orange-juice"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["在一个老式的玻璃杯里，用茶匙的背面，把苦味酒和水混合到方糖里。几乎把玻璃杯装满冰块，然后加入波旁威士忌。用橘子片和樱桃装饰。配上搅拌棒。"],"tip":""},{"id":"11255","cn":"丁香鸡尾酒","en":"Clove Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[2.4,4.1],"img":"img/11255.jpg","ings":[{"zh":"甜味美思（红）","m":"1 oz","t":"酒","k":"sweet-vermouth"},{"zh":"黑刺李金酒","m":"1/2 oz","t":"酒","k":"gin"},{"zh":"酒","m":"1/2 oz Muscatel","t":"酒","k":"x:酒"}],"steps":["将所有配料加冰搅拌，滤入鸡尾酒杯，即可享用。"],"tip":""},{"id":"178369","cn":"鸡尾酒马颈","en":"Cocktail Horse’s Neck","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[11.6,23.3],"img":"img/178369.jpg","ings":[{"zh":"白兰地/干邑","m":"4 cl","t":"酒","k":"brandy"},{"zh":"姜汁啤酒/干姜水","m":"100 ml","t":"饮料","k":"ginger-beer"},{"zh":"安高天娜苦精","m":"3 drops","t":"酒","k":"bitters"},{"zh":"柠檬","m":"1","t":"水果","k":"lemon"}],"steps":["将一颗有机、未经处理的柠檬洗净刷净，然后用果皮刀削出一整条螺旋状柠檬皮。如果太大，用锋利的刀修小。在高身平底杯中放入一些冰块，放入柠檬皮，倒入干邑，加入姜汁啤酒，并滴入2至3滴安高天娜苦精。做法简单，但一旦尝试你就会爱上它。"],"tip":""},{"id":"12798","cn":"咖啡利口酒","en":"Coffee Liqueur","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[25.2,72.1],"img":"img/12798.jpg","ings":[{"zh":"浓缩咖啡","m":"10 tblsp instant","t":"饮料","k":"espresso"},{"zh":"香草精","m":"4 tblsp","t":"","k":"x:香草精"},{"zh":"糖浆","m":"2 1/2 cups","t":"糖浆","k":"syrup"},{"zh":"伏特加","m":"1 qt","t":"酒","k":"vodka"},{"zh":"水","m":"2 1/2 cups","t":"饮料","k":"x:水"}],"steps":["将咖啡、糖和水混合。炖煮1小时，放凉。加入香草精和伏特加。装入密封罐中陈放2至3周。"],"tip":""},{"id":"12800","cn":"Coffee-Vodka","en":"Coffee-Vodka","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[38.8,95.8],"img":"img/12800.jpg","ings":[{"zh":"水","m":"2 cups","t":"饮料","k":"x:水"},{"zh":"糖浆","m":"2 cups white","t":"糖浆","k":"syrup"},{"zh":"浓缩咖啡","m":"1/2 cup instant","t":"饮料","k":"espresso"},{"zh":"香草","m":"1/2","t":"","k":"x:香草"},{"zh":"伏特加","m":"1 1/2 cup","t":"酒","k":"vodka"},{"zh":"焦糖色素","m":"","t":"","k":"x:焦糖色素"}],"steps":["将水和糖煮沸直至溶解。关掉暖气。慢慢加入速溶咖啡，继续搅拌。在伏特加中加入切碎的香草豆，然后将冷却的糖浆和咖啡溶液与伏特加混合。盖紧盖子，每天用力摇晃，持续3周。过滤和过滤。最好让糖混合物完全冷却，这样伏特加在加入时就不会蒸发。如果你喜欢利口酒更顺滑的感觉，你可以在成品中加入大约1茶匙甘油。"],"tip":""},{"id":"17108","cn":"可乐滴","en":"Coke and Drops","cat":"软饮","alc":"无酒精","glass":"Cocktail glass","tags":[],"cost":[9.7,16.4],"img":"img/17108.jpg","ings":[{"zh":"可乐","m":"1 dl","t":"饮料","k":"cola"},{"zh":"柠檬","m":"7 drops","t":"水果","k":"lemon"}],"steps":["取一只杯子，把可乐倒入杯中，然后加入7滴柠檬汁。在杯口用一片柠檬装饰。"],"tip":""},{"id":"17830","cn":"玉米油","en":"Corn n Oil","cat":"鸡尾酒","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[5.9,11.0],"img":"img/17830.jpg","ings":[{"zh":"青柠","m":"1/2","t":"水果","k":"lime"},{"zh":"Falernum","m":"1/3 oz","t":"","k":"x:Falernum"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"},{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"}],"steps":["将半个青柠再对半切开。把青柠、法勒南糖浆和苦精加入古典杯中。捣压。加入朗姆酒。（推荐使用陈年巴巴多斯朗姆酒，如 Plantation 5 Year。）加入冰块并搅拌。将黑糖蜜朗姆酒漂浮于表面。配吸管饮用。"],"tip":""},{"id":"14133","cn":"世界性的马提尼","en":"Cosmopolitan Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail Glass","tags":[],"cost":[5.7,11.2],"img":"img/14133.jpg","ings":[{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"青柠","m":"Juice of 1/2","t":"水果","k":"lime"},{"zh":"蔓越莓汁","m":"1 splash","t":"饮料","k":"cranberry-juice"}],"steps":["将所有配料倒入半杯冰块的调酒杯中，摇和并滤入冰镇的马天尼杯中。"],"tip":""},{"id":"12802","cn":"蔓越莓甜露","en":"Cranberry Cordial","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[72.1,148.3],"img":"img/12802.jpg","ings":[{"zh":"小红莓","m":"1/2 kg chopped","t":"","k":"x:小红莓"},{"zh":"糖浆","m":"3/4 L","t":"糖浆","k":"syrup"},{"zh":"白朗姆","m":"1/2 L","t":"酒","k":"white-rum"}],"steps":["将切碎的红酸果蔓放入带密封盖的2升罐中。加入糖和朗姆酒。盖紧盖子，把罐子放在阴凉避光处。每天将罐子倒置并摇晃，持续六周。将果酒滤入瓶中，用软木塞封口。"],"tip":""},{"id":"12890","cn":"蔓越莓穿孔","en":"Cranberry Punch","cat":"潘趣/派对饮品","alc":"无酒精","glass":"Punch Bowl","tags":[],"cost":[21.9,48.0],"img":"img/12890.jpg","ings":[{"zh":"蔓越莓汁","m":"4 cups","t":"饮料","k":"cranberry-juice"},{"zh":"糖浆","m":"1 1/2 cup","t":"糖浆","k":"syrup"},{"zh":"菠萝汁","m":"4 cups","t":"饮料","k":"pineapple-juice"},{"zh":"杏仁糖浆 Orgeat","m":"1 tblsp","t":"糖浆","k":"almond-syrup"},{"zh":"姜汁啤酒/干姜水","m":"2 qt","t":"饮料","k":"ginger-beer"}],"steps":["混合前四种原料。搅拌至糖溶解，放凉。然后在食用前加入姜汁汽水。加入冰环以保持冲床的低温。"],"tip":""},{"id":"14608","cn":"奶油苏打","en":"Cream Soda","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[3.0,5.5],"img":"img/14608.jpg","ings":[{"zh":"黑朗姆/深色朗姆","m":"1 oz","t":"酒","k":"dark-rum"},{"zh":"姜汁啤酒/干姜水","m":"","t":"饮料","k":"ginger-beer"}],"steps":["在高球杯中加冰，倒入1盎司香料朗姆酒。用姜汁汽水补满。"],"tip":""},{"id":"12808","cn":"薄荷奶油利口酒","en":"Creme de Menthe","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[158.0,319.4],"img":"img/12808.jpg","ings":[{"zh":"糖浆","m":"8 cups","t":"糖浆","k":"syrup"},{"zh":"水","m":"6 cups","t":"饮料","k":"x:水"},{"zh":"酒精","m":"1 pint","t":"","k":"x:酒精"},{"zh":"薄荷","m":"1 oz pure","t":"植物材料","k":"mint"},{"zh":"食用色素","m":"1 tblsp green","t":"","k":"x:食用色素"}],"steps":["将糖和水煮沸，再以小火煨10分钟。冷却。加入其余原料并搅拌。加盖，静置熟化1个月。"],"tip":""},{"id":"13751","cn":"自由古巴","en":"Cuba Libra","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[17.9,31.5],"img":"img/13751.jpg","ings":[{"zh":"黑朗姆/深色朗姆","m":"1-2 shot","t":"酒","k":"dark-rum"},{"zh":"青柠","m":"Squeeze","t":"水果","k":"lime"},{"zh":"可乐","m":"Fill with","t":"饮料","k":"cola"},{"zh":"冰块","m":"","t":"其他","k":"ice"}],"steps":["Fill tall glass with ice cubes. Add rum. Rub cut edge of lime on rim of glass then squeeze juice into glass. Fill with Coca-Cola. Garnish with lime slice. Enjoy!"],"tip":""},{"id":"13194","cn":"左右为难","en":"Damned if you do","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[2.4,4.7],"img":"img/13194.jpg","ings":[{"zh":"波本威士忌","m":"0.75 oz","t":"酒","k":"bourbon"},{"zh":"热的","m":"0.25 oz","t":"","k":"x:热的"}],"steps":["倒入子弹杯中。送入口中。视需要重复。"],"tip":""},{"id":"15409","cn":"Danbooka","en":"Danbooka","cat":"咖啡/茶","alc":"含酒精","glass":"Coffee Mug","tags":[],"cost":[6.0,18.0],"img":"img/15409.jpg","ings":[{"zh":"浓缩咖啡","m":"3 parts","t":"饮料","k":"espresso"},{"zh":"Everclear","m":"1 part","t":"","k":"x:Everclear"}],"steps":["倒入杯中并搅拌均匀。"],"tip":""},{"id":"17177","cn":"黑卡琵莉亚","en":"Dark Caipirinha","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[12.5,25.1],"img":"img/17177.jpg","ings":[{"zh":"糖浆","m":"2 tsp","t":"糖浆","k":"syrup"},{"zh":"青柠","m":"1","t":"水果","k":"lime"},{"zh":"卡莎萨","m":"2 1/2 oz","t":"酒","k":"cachaca"}],"steps":["在古典杯中把糖捣压进青柠角。用方冰填满杯中。将卡莎萨倒入杯中。充分搅拌。"],"tip":""},{"id":"14482","cn":"暗木司令","en":"Darkwood Sling","cat":"软饮","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[5.8,10.0],"img":"img/14482.jpg","ings":[{"zh":"樱桃白兰地/樱桃酒","m":"1 part","t":"酒","k":"cherry-brandy"},{"zh":"苏打水","m":"1 part","t":"饮料","k":"soda"},{"zh":"橙汁","m":"1 part","t":"饮料","k":"orange-juice"},{"zh":"冰块","m":"cubes","t":"其他","k":"ice"}],"steps":["有很多不错的樱桃利口酒可以用，但我更喜欢喜灵。加入一份利口酒。然后加入一份苏打水。要做酸味斯林，就用汤力水（大多数人更喜欢不加汤力水的版本）。之后用橙汁和冰块把杯子加满。"],"tip":""},{"id":"17187","cn":"德比","en":"Derby","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":["Classic","IBA"],"cost":[10.4,20.8],"img":"img/17187.jpg","ings":[{"zh":"金酒","m":"6 cl","t":"酒","k":"gin"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"薄荷","m":"2 Fresh leaves","t":"植物材料","k":"mint"}],"steps":["将所有配料加冰倒入调酒杯中。搅拌。滤入鸡尾酒杯。在酒中装饰以一枝新鲜薄荷。"],"tip":""},{"id":"13128","cn":"柴油","en":"Diesel","cat":"啤酒","alc":"含酒精","glass":"Pint glass","tags":[],"cost":null,"img":"img/13128.jpg","ings":[{"zh":"啤酒","m":"1/2 pint","t":"饮料","k":"ginger-beer"},{"zh":"苹果酒","m":"1/2 pint","t":"水果","k":"x:苹果酒"},{"zh":"黑加仑糖浆","m":"1 dash","t":"糖浆","k":"syrup"}],"steps":["先倒入拉格啤酒，再加入黑加仑利口酒。用苹果酒补满。颜色应非常深，接近吉尼斯黑啤的颜色。"],"tip":""},{"id":"14466","cn":"肮脏的乳头","en":"Dirty Nipple","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":null,"img":"img/14466.jpg","ings":[{"zh":"咖啡利口酒","m":"","t":"酒","k":"coffee-liqueur"},{"zh":"深色的","m":"","t":"","k":"x:深色的"},{"zh":"百利甜酒/爱尔兰奶油","m":"","t":"酒","k":"baileys"}],"steps":["这是一款分层shot——百利甜必须在上层"],"tip":""},{"id":"16991","cn":"降档","en":"Downshift","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Hurricane glass","tags":[],"cost":[7.4,14.6],"img":"img/16991.jpg","ings":[{"zh":"果汁","m":"2 part","t":"饮料","k":"x:果汁"},{"zh":"雪碧/柠檬汽水","m":"1 part","t":"饮料","k":"sprite"},{"zh":"龙舌兰（银标）","m":"2 shots","t":"酒","k":"tequila"},{"zh":"白朗姆","m":"Float Bacardi","t":"酒","k":"white-rum"}],"steps":["Start with the Sprite. Next comes the tequila. After that, add the Minute Maid Fruit Punch, then float the 151. Rocks optional."],"tip":""},{"id":"11320","cn":"蜻蜓","en":"Dragonfly","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[2.7,5.4],"img":"img/11320.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"姜汁啤酒/干姜水","m":"4 oz","t":"饮料","k":"ginger-beer"},{"zh":"青柠","m":"1","t":"水果","k":"lime"}],"steps":["在海波杯中几乎装满冰块，加入金酒和姜汁汽水，充分搅拌，用青柠角装饰。"],"tip":""},{"id":"12736","cn":"喝巧克力","en":"Drinking Chocolate","cat":"可可饮品","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[14.8,30.8],"img":"img/12736.jpg","ings":[{"zh":"淡奶油/牛奶","m":"2 oz","t":"饮料","k":"cream"},{"zh":"淡奶油/牛奶","m":"6-8 oz","t":"饮料","k":"cream"},{"zh":"肉豆蔻/肉桂粉","m":"1 stick","t":"调料","k":"nutmeg"},{"zh":"香草","m":"1","t":"","k":"x:香草"},{"zh":"可乐","m":"2 oz finely chopped dark","t":"饮料","k":"cola"},{"zh":"淡奶油/牛奶","m":"Fresh","t":"饮料","k":"cream"}],"steps":["将奶油和牛奶与肉桂、香草荚一起用极小火加热15至20分钟（若没有香草荚，加热后加入1至2茶匙香草精）。取出香草荚和肉桂，加入巧克力，搅拌至完全融化。食用时顶部加上一些非常浓稠的新鲜打发奶油。此分量可供1至2人享用，视食量而定。若想要更浓郁的巧克力味，可用4盎司牛奶、4盎司奶油、4盎司巧克力。盛入马克杯中饮用。"],"tip":""},{"id":"11324","cn":"罗布·罗伊","en":"Dry Rob Roy","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[10.1,22.2],"img":"img/11324.jpg","ings":[{"zh":"苏格兰威士忌","m":"2 1/2 oz","t":"酒","k":"scotch"},{"zh":"干味美思（白）","m":"1 1/2 tsp","t":"酒","k":"dry-vermouth"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["在装半杯冰块的调酒杯中，加入苏格兰威士忌和味美思，充分搅拌，滤入鸡尾酒杯，用柠檬皮扭条装饰。"],"tip":""},{"id":"11326","cn":"杜本内酒鸡尾酒","en":"Dubonnet Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[0.2,0.4],"img":"img/11326.jpg","ings":[{"zh":"杜本内酒胭脂","m":"1 1/2 oz","t":"","k":"x:杜本内酒胭脂"},{"zh":"金酒","m":"3/4 oz","t":"酒","k":"gin"},{"zh":"安高天娜苦精","m":"1 dash","t":"酒","k":"bitters"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["Stir all ingredients (except lemon peel) with ice and strain into a cocktail glass. Add the twist of lemon peel and serve."],"tip":""},{"id":"17182","cn":"杜尚的穿孔","en":"Duchamp's Punch","cat":"鸡尾酒","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[38.3,76.6],"img":"img/17182.jpg","ings":[{"zh":"皮斯科","m":"5 cl","t":"","k":"x:皮斯科"},{"zh":"青柠","m":"2.5 cl","t":"水果","k":"lime"},{"zh":"菠萝汁","m":"2.5 cl","t":"饮料","k":"pineapple-juice"},{"zh":"圣日尔曼","m":"1.5 cl","t":"","k":"x:圣日尔曼"},{"zh":"安高天娜苦精","m":"2 Dashes","t":"酒","k":"bitters"},{"zh":"黑胡椒","m":"Pinch","t":"调料","k":"pepper"},{"zh":"薰衣草","m":"2 sprigs","t":"","k":"x:薰衣草"}],"steps":["将所有原料摇和，双重滤入加有大冰块的冰镇双份古典杯中，用几枝薰衣草作装饰。"],"tip":""},{"id":"12668","cn":"蛋蜜乳","en":"Egg Cream","cat":"其他/不详","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[10.4,21.3],"img":"img/12668.jpg","ings":[{"zh":"可乐","m":"2 tblsp","t":"饮料","k":"cola"},{"zh":"淡奶油/牛奶","m":"6 oz whole","t":"饮料","k":"cream"},{"zh":"苏打水","m":"6 oz","t":"饮料","k":"soda"}],"steps":["在喷泉杯中混合糖浆和牛奶。加入苏打水，配吸管奉客。"],"tip":""},{"id":"12910","cn":"蛋奶酒4号","en":"Egg Nog #4","cat":"潘趣/派对饮品","alc":"可含可不含","glass":"Punch bowl","tags":[],"cost":[53.4,108.2],"img":"img/12910.jpg","ings":[{"zh":"蛋白","m":"6","t":"其他","k":"egg-white"},{"zh":"糖浆","m":"1/4 cup","t":"糖浆","k":"syrup"},{"zh":"淡奶油/牛奶","m":"2 cups","t":"饮料","k":"cream"},{"zh":"白朗姆","m":"1/2 cup","t":"酒","k":"white-rum"},{"zh":"波本威士忌","m":"1/2 cup","t":"酒","k":"bourbon"},{"zh":"香草精","m":"1 tsp","t":"","k":"x:香草精"},{"zh":"盐","m":"1/4 tsp","t":"调料","k":"salt"},{"zh":"淡奶油/牛奶","m":"1 cup","t":"饮料","k":"cream"},{"zh":"蛋白","m":"6","t":"其他","k":"egg-white"},{"zh":"糖浆","m":"1/4 cup","t":"糖浆","k":"syrup"},{"zh":"肉豆蔻/肉桂粉","m":"Ground","t":"调料","k":"nutmeg"}],"steps":["在小搅拌碗中打散蛋黄。逐渐加入1/4杯糖，高速搅打至浓稠且呈柠檬色。搅入牛奶，再搅入朗姆酒、波本威士忌、香草精和盐。彻底冷藏。打发奶油。将打蛋器清洗干净。在大搅拌碗中将蛋白打至湿性发泡。逐渐加入剩余的1/4杯糖，打至干性发泡。将蛋黄混合物和打发的奶油拌入蛋白中。立即享用。在每份上撒上肉豆蔻。盛入潘趣碗或其他大碗中。注：若制作无酒精蛋奶酒，按上述方法制作，但省略波本威士忌和朗姆酒，并将牛奶增加至3杯。"],"tip":""},{"id":"12916","cn":"健康蛋奶酒","en":"Egg Nog - Healthy","cat":"潘趣/派对饮品","alc":"可含可不含","glass":"Collins Glass","tags":[],"cost":[149.5,302.4],"img":"img/12916.jpg","ings":[{"zh":"蛋白","m":"1/2 cup","t":"其他","k":"egg-white"},{"zh":"糖浆","m":"3 tblsp","t":"糖浆","k":"syrup"},{"zh":"淡奶油/牛奶","m":"13 oz skimmed","t":"饮料","k":"cream"},{"zh":"淡奶油/牛奶","m":"3/4 cup skimmed","t":"饮料","k":"cream"},{"zh":"香草精","m":"1 tsp","t":"","k":"x:香草精"},{"zh":"白朗姆","m":"1 tsp","t":"酒","k":"white-rum"},{"zh":"肉豆蔻/肉桂粉","m":"","t":"调料","k":"nutmeg"}],"steps":["将蛋代用品与糖一起打发，加入两种牛奶、香草和朗姆酒混合。充分搅匀。冷藏一夜。撒上肉豆蔻。可做6份。"],"tip":""},{"id":"12914","cn":"经典熟制蛋奶酒","en":"Egg-Nog - Classic Cooked","cat":"潘趣/派对饮品","alc":"可含可不含","glass":"Pitcher","tags":[],"cost":[10.0,21.1],"img":"img/12914.jpg","ings":[{"zh":"蛋白","m":"6","t":"其他","k":"egg-white"},{"zh":"糖浆","m":"1/4 cup","t":"糖浆","k":"syrup"},{"zh":"盐","m":"1/4 tsp","t":"调料","k":"salt"},{"zh":"淡奶油/牛奶","m":"1 qt","t":"饮料","k":"cream"},{"zh":"香草精","m":"1 tsp","t":"","k":"x:香草精"}],"steps":["在一个大炖锅里，如果需要的话，把鸡蛋、糖和盐搅拌在一起。加入两杯牛奶搅拌。用小火煮，不断搅拌，直到混合物足够厚，覆盖在金属勺子上，温度达到华氏160度。加入剩下的两杯牛奶和香草。盖上盖子，冷藏至完全冷却，几个小时或一夜。在上桌之前，倒入碗或水罐。装饰或加入搅拌，如果需要的话。选择一种或几种：巧克力卷，肉桂棒，调味料提取物，调味白兰地或利口酒，果汁或花蜜，肉豆蔻粉，马拉斯奇诺樱桃，橙子片，薄荷棒或糖棍，普通白兰地，威士忌或威士忌，果子露或冰淇淋，鲜奶油，搅打。即可食用。"],"tip":""},{"id":"178346","cn":"接骨木花卡琵利亚","en":"Elderflower Caipirinha","cat":"鸡尾酒","alc":"含酒精","glass":"Collins glass","tags":["Brazilian"],"cost":[10.1,20.1],"img":"img/178346.jpg","ings":[{"zh":"卡莎萨","m":"60 ml","t":"酒","k":"cachaca"},{"zh":"青柠","m":"1","t":"水果","k":"lime"},{"zh":"接骨木花糖浆","m":"3 cl","t":"糖浆","k":"syrup"}],"steps":["取杯子，把青柠在杯中捣压。杯中装满碎冰，加入卡莎萨。充分搅拌，再补满一些碎冰。用青柠装饰，尽情享用！"],"tip":""},{"id":"17246","cn":"恩佩隆厨房油脂洗梅斯卡尔","en":"Empellón Cocina's Fat-Washed Mezcal","cat":"鸡尾酒","alc":"含酒精","glass":"Beer Glass","tags":[],"cost":[9.2,17.7],"img":"img/17246.jpg","ings":[{"zh":"龙舌兰（银标）","m":"2 oz","t":"酒","k":"tequila"},{"zh":"可乐","m":"3/4 oz","t":"饮料","k":"cola"},{"zh":"咖啡利口酒","m":"1/2 oz","t":"酒","k":"coffee-liqueur"}],"steps":["为了让你的猪油和他们的一样美味，以下是他们的阿多波腌料及其用法（你还需要一整扇肋排）：4个安乔辣椒、8个瓜希约辣椒和4个奇波雷辣椒，外加4瓣烤蒜、半杯苹果醋、四分之一茶匙墨西哥牛至、1茶匙黑胡椒粉、1整颗丁香、四分之一茶匙肉桂粉和半茶匙孜然粉。将干辣椒烘烤后浸水至少1小时，直至回软。沥干并弃去浸泡液。将泡软的辣椒与其余配料混合，打至顺滑。冷熏一整扇猪仔排：取一个大号酒店烤盘，一侧放木屑，另一侧放木炭。在木炭／木屑盘上方再放一个较小的盛有猪肋排的烤盘。点燃木炭，注意不要引燃木屑。用锡纸盖住两个烤盘，熏10至15分钟，直至达到理想的烟熏程度，然后涂上阿多波腌料并用锡纸包裹，再将肋排放入300华氏度的烤箱烤7小时。肋排冷却后，滤出油脂，用于浸泡。如果你很难达到同样体积的油脂，可用肉铺的猪板油补足。若想不用肋排也获得同样浓郁的滋味，可将油脂与几勺腌料一同在锅中加热。待你那桶调味猪油冷却成液态后，将等量的Ilegal Joven梅斯卡尔和猪油倒入可密封容器中。密封容器，充分摇匀，然后放入冷冻室静置一夜。待整体分离凝固后，用细网锥形滤器滤入。如果没有锥形滤器，可用细网滤筛；若连滤筛也没有，可尝试用勺子撇去大部分油脂。滤过的梅斯卡尔中还会残留一些橙色油脂珠：用几层芝士布（应急时可用咖啡滤纸）过滤，以去除最后一点油脂。梅斯卡尔现在即可饮用，纯饮或调制成鸡尾酒皆可。哈瓦那辣椒酊剂：将哈瓦那辣椒切片，加入2盎司Ilegal Joven梅斯卡尔。静置一夜，或直至达到理想的辣度。鸡尾酒：将梅斯卡尔和巧克力利口酒倒入加冰的调酒杯中，搅拌45秒。滤入冰镇的碟形香槟杯。用勺子小心地将咖啡利口酒沿杯壁沉入碟形杯底部。以5滴哈瓦那辣椒酊剂装饰。"],"tip":""},{"id":"11338","cn":"英语高杯酒","en":"English Highball","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[6.5,12.6],"img":"img/11338.jpg","ings":[{"zh":"白兰地/干邑","m":"3/4 oz","t":"酒","k":"brandy"},{"zh":"金酒","m":"3/4 oz","t":"酒","k":"gin"},{"zh":"甜味美思（红）","m":"3/4 oz","t":"酒","k":"sweet-vermouth"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"},{"zh":"柠檬","m":"","t":"水果","k":"lemon"}],"steps":["将白兰地、金酒和甜味美思倒入加有冰块的高球杯中。注入碳酸水至满。加入柠檬皮扭条，搅拌后饮用。（如更喜欢，可用姜汁汽水代替碳酸水。）"],"tip":""},{"id":"11339","cn":"英式玫瑰鸡尾酒","en":"English Rose Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[9.8,19.4],"img":"img/11339.jpg","ings":[{"zh":"白兰地/干邑","m":"3/4 oz","t":"酒","k":"brandy"},{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"干味美思（白）","m":"3/4 oz","t":"酒","k":"dry-vermouth"},{"zh":"石榴糖浆","m":"1 tsp","t":"糖浆","k":"grenadine"},{"zh":"柠檬","m":"1/4 tsp","t":"水果","k":"lemon"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["用柠檬汁擦拭鸡尾酒杯杯口，再将杯口蘸上糖粉。将除樱桃外的所有材料加冰摇和，滤入糖边杯中。放上樱桃作装饰，即可奉客。"],"tip":""},{"id":"178309","cn":"浓缩咖啡朗姆天尼","en":"Espresso Rumtini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["DinnerParty","StrongFlavor"],"cost":[9.5,24.3],"img":"img/178309.jpg","ings":[{"zh":"白朗姆","m":"1 shot","t":"酒","k":"white-rum"},{"zh":"香草糖浆","m":"1/2 shot","t":"糖浆","k":"syrup"},{"zh":"浓缩咖啡","m":"1 shot","t":"饮料","k":"espresso"},{"zh":"浓缩咖啡","m":"1 shot","t":"饮料","k":"espresso"}],"steps":["在鸡尾酒杯中混合均匀。撒上少许巧克力粉，并以咖啡豆装饰"],"tip":""},{"id":"13070","cn":"华氏5000","en":"Fahrenheit 5000","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[0.1,0.4],"img":"img/13070.jpg","ings":[{"zh":"烈酒","m":"1/2 oz","t":"","k":"x:烈酒"},{"zh":"绝对伏特加胡椒味","m":"1/2 oz","t":"酒","k":"vodka"},{"zh":"塔巴斯科辣酱","m":"1 dash","t":"调料","k":"tabasco"}],"steps":["用塔巴斯科辣酱铺满子弹杯杯底，然后以一半 Firewater 和一半 Absolut Peppar 注满。"],"tip":""},{"id":"178344","cn":"无花果百里香","en":"Figgy Thyme","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":["Christmas","Sweet"],"cost":[5.2,11.9],"img":"img/178344.jpg","ings":[{"zh":"伏特加","m":"2 oz","t":"酒","k":"vodka"},{"zh":"蜂蜜","m":"1 tsp","t":"糖浆","k":"x:蜂蜜"},{"zh":"无花果","m":"3","t":"","k":"x:无花果"},{"zh":"百里香","m":"1 Sprig","t":"植物材料","k":"x:百里香"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"汤力水","m":"Top","t":"饮料","k":"tonic"}],"steps":["在一个路易斯包里，像球手/疯子一样碾碎一些冰。把你珍贵的冰块倒入柯林斯杯。在鸡尾酒调酒器中，将无花果和百里香混合在一起。加入蜂蜜伏特加、柠檬汁和一块大冰块。摇匀至完全冷却，滤入玻璃杯。加入汤力水，最后加入2滴安古斯图拉苦酒。再用切片无花果和百里香。"],"tip":""},{"id":"13202","cn":"烈焰胡椒博士","en":"Flaming Dr. Pepper","cat":"烈酒一口杯","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[9.6,20.2],"img":"img/13202.jpg","ings":[{"zh":"杏仁利口酒","m":"1 oz","t":"酒","k":"amaretto"},{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"白朗姆","m":"1 oz Bacardi","t":"酒","k":"white-rum"},{"zh":"黑胡椒","m":"1 oz","t":"调料","k":"pepper"},{"zh":"啤酒","m":"1 oz","t":"饮料","k":"ginger-beer"}],"steps":["加入杏仁利口酒、百加得朗姆酒和伏特加。拌入 Dr. Pepper 汽水和啤酒"],"tip":""},{"id":"16485","cn":"燃烧的兰博基尼","en":"Flaming Lamborghini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[10.1,17.7],"img":"img/16485.jpg","ings":[{"zh":"咖啡利口酒","m":"1 oz","t":"酒","k":"coffee-liqueur"},{"zh":"深色的","m":"1 oz","t":"","k":"x:深色的"},{"zh":"蓝橙力娇酒","m":"1 oz","t":"酒","k":"blue-curacao"},{"zh":"百利甜酒/爱尔兰奶油","m":"1 oz","t":"酒","k":"baileys"}],"steps":["将 Sambuca 和 Kahlua 倒入鸡尾酒杯，给饮用者一根吸管。将 Baileys 和 Blue Curacao 分别倒入鸡尾酒杯两侧的两个 shot 杯中。点燃鸡尾酒杯中的混合液，开始用吸管饮用（这杯酒应一口喝完），当喝到杯底时，将 Baileys 和 Blue Curacao 倒入鸡尾酒杯中熄灭火焰，继续喝到全部喝完！！"],"tip":""},{"id":"13675","cn":"弗兰德的昏倒","en":"Flander's Flake-Out","cat":"普通饮品","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":null,"img":"img/13675.jpg","ings":[{"zh":"深色的","m":"1/4 glass","t":"","k":"x:深色的"},{"zh":"菝葜","m":"3/4 glass","t":"","k":"x:菝葜"}],"steps":["把这两样都一股脑儿倒进去。"],"tip":""},{"id":"11368","cn":"飞翔的荷兰人","en":"Flying Dutchman","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[2.5,4.0],"img":"img/11368.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"}],"steps":["在几乎装满冰块的古典杯中，混合金酒和白橙皮力娇酒。充分搅拌。"],"tip":""},{"id":"11369","cn":"飞行苏格兰人","en":"Flying Scotchman","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[6.4,13.1],"img":"img/11369.jpg","ings":[{"zh":"苏格兰威士忌","m":"1 oz","t":"酒","k":"scotch"},{"zh":"甜味美思（红）","m":"1 oz","t":"酒","k":"sweet-vermouth"},{"zh":"安高天娜苦精","m":"1 dash","t":"酒","k":"bitters"},{"zh":"糖浆","m":"1/4 tsp","t":"糖浆","k":"syrup"}],"steps":["将所有配料加冰摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"11375","cn":"狡猾的女人","en":"Foxy Lady","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[6.4,12.0],"img":"img/11375.jpg","ings":[{"zh":"杏仁利口酒","m":"1/2 oz","t":"酒","k":"amaretto"},{"zh":"可可利口酒","m":"1/2 oz","t":"酒","k":"cocoa-liqueur"},{"zh":"淡奶油/牛奶","m":"2 oz","t":"饮料","k":"cream"}],"steps":["将所有配料加冰摇和，滤入冰镇的鸡尾酒杯中即可饮用。"],"tip":""},{"id":"12768","cn":"冰冻过的","en":"Frappé","cat":"咖啡/茶","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[14.0,36.5],"img":"img/12768.jpg","ings":[{"zh":"浓缩咖啡","m":"1/2 cup black","t":"饮料","k":"espresso"},{"zh":"淡奶油/牛奶","m":"1/2 cup","t":"饮料","k":"cream"},{"zh":"糖浆","m":"1-2 tsp","t":"糖浆","k":"syrup"}],"steps":["混合在一起。以最高速度搅拌约1分钟。倒入玻璃杯中，用吸管喝。注意：如果所有的东西都是冷的，这个方法效果最好(如果你做的是新鲜的咖啡，把它和牛奶混合，然后在冰箱里放半个小时。如果没有泡沫，就多加点牛奶，甚至多加点奶粉。泡沫在杯底逐渐变成液体，所以你会发现你可以坐下来喝大约半小时，更多的冰咖啡不断出现在杯底。非常让人耳目一新。"],"tip":""},{"id":"14688","cn":"弗雷迪克鲁格","en":"Freddy Kruger","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[1.2,2.8],"img":"img/14688.jpg","ings":[{"zh":"Jagermeister","m":"1/2 oz","t":"","k":"x:Jagermeister"},{"zh":"深色的","m":"1/2 oz","t":"","k":"x:深色的"},{"zh":"伏特加","m":"1/2 oz","t":"酒","k":"vodka"}],"steps":["调成一份大杯的烈酒shot！！"],"tip":""},{"id":"17213","cn":"法国马提尼","en":"French Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["NewEra","IBA"],"cost":[3.8,8.8],"img":"img/17213.jpg","ings":[{"zh":"伏特加","m":"4.5 cl","t":"酒","k":"vodka"},{"zh":"覆盆子利口酒","m":"1.5 cl","t":"酒","k":"x:覆盆子利口酒"},{"zh":"菠萝汁","m":"1.5 cl","t":"饮料","k":"pineapple-juice"}],"steps":["将所有配料加冰块倒入摇壶中。充分摇和并滤入冰镇的鸡尾酒杯。将柠檬皮中的油挤压到酒上。"],"tip":""},{"id":"17248","cn":"法国内格罗尼酒","en":"French Negroni","cat":"鸡尾酒","alc":"含酒精","glass":"Martini Glass","tags":[],"cost":[2.7,4.9],"img":"img/17248.jpg","ings":[{"zh":"金酒","m":"1 oz","t":"酒","k":"gin"},{"zh":"Lillet","m":"1 oz","t":"","k":"x:Lillet"},{"zh":"甜味美思（红）","m":"1 oz","t":"酒","k":"sweet-vermouth"},{"zh":"橙汁","m":"1","t":"饮料","k":"orange-juice"}],"steps":["在摇壶中加冰，倒入全部原料。用吧勺搅拌40至45圈，或搅拌至完全冰镇。滤入马天尼杯，或滤入加冰的岩石杯。以橙皮扭条装饰。"],"tip":""},{"id":"11382","cn":"弗里斯科酸酒","en":"Frisco Sour","cat":"普通饮品","alc":"含酒精","glass":"Whiskey sour glass","tags":[],"cost":[14.9,28.5],"img":"img/11382.jpg","ings":[{"zh":"波本威士忌","m":"2 oz","t":"酒","k":"bourbon"},{"zh":"廊酒 Bénédictine","m":"1/2 oz","t":"酒","k":"benedictine"},{"zh":"柠檬","m":"Juice of 1/4","t":"水果","k":"lemon"},{"zh":"青柠","m":"Juice of 1/2","t":"水果","k":"lime"},{"zh":"柠檬","m":"1 slice","t":"水果","k":"lemon"},{"zh":"青柠","m":"1 slice","t":"水果","k":"lime"}],"steps":["将所有配料（柠檬片和青柠片除外）加冰摇和，滤入酸酒杯中。用柠檬片和青柠片装饰即可饮用。"],"tip":""},{"id":"178352","cn":"冰霜桃红","en":"Frosé","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["Cold","Frozen","Summer"],"cost":[182.5,366.7],"img":"img/178352.jpg","ings":[{"zh":"玫瑰","m":"750 ml","t":"","k":"x:玫瑰"},{"zh":"糖浆","m":"1/2 cup","t":"糖浆","k":"syrup"},{"zh":"草莓","m":"8 oz","t":"水果","k":"x:草莓"},{"zh":"柠檬","m":"2-3 oz","t":"水果","k":"lemon"}],"steps":["Step 1\nPour rosé into a 13x9\" pan and freeze until almost solid (it won't completely solidify due to the alcohol), at least 6 hours.\n\nStep 2\nMeanwhile, bring sugar and ½ cup water to a boil in a medium saucepan; cook, stirring constantly, until sugar dissolves, about 3 minutes. Add strawberries, remove from heat, and let sit 30 minutes to infuse syrup with strawberry flavor. Strain through a fine-mesh sieve into a small bowl (do not press on solids); cover and chill until cold, about 30 minutes.\n\nStep 3\nScrape rosé into a blender. Add lemon juice, 3½ ounces strawberry syrup, and 1 cup crushed ice and purée until smooth. Transfer blender jar to freezer and freeze until frosé is thickened (aim for milkshake consistency), 25–35 minutes.\n\nStep 4\nBlend again until frosé is slushy. Divide among glasses.\n\nStep 5\nDo Ahead: Rosé can be frozen 1 week ahead."],"tip":""},{"id":"11387","cn":"冰冻代基里酒","en":"Frozen Daiquiri","cat":"普通饮品","alc":"含酒精","glass":"Champagne flute","tags":[],"cost":[87.7,196.6],"img":"img/11387.jpg","ings":[{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"君度/三重橙酒","m":"1 tblsp","t":"酒","k":"cointreau"},{"zh":"青柠","m":"1 1/2 oz","t":"水果","k":"lime"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"},{"zh":"冰块","m":"1 cup crushed","t":"其他","k":"ice"}],"steps":["将所有材料（樱桃除外）放入电动搅拌机，先以低速搅打五秒，再以高速搅打至质地坚实。将内容物倒入香槟笛形杯，顶部放上樱桃，出品。"],"tip":""},{"id":"11390","cn":"冰霜薄荷代基里","en":"Frozen Mint Daiquiri","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[36.4,72.2],"img":"img/11390.jpg","ings":[{"zh":"白朗姆","m":"2 oz","t":"酒","k":"white-rum"},{"zh":"青柠","m":"1 tblsp","t":"水果","k":"lime"},{"zh":"薄荷","m":"6","t":"植物材料","k":"mint"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"}],"steps":["将所有配料与1杯碎冰放入电动搅拌机中混合。低速短时搅打。倒入古典杯中即可饮用。"],"tip":""},{"id":"11391","cn":"冰霜菠萝代基里","en":"Frozen Pineapple Daiquiri","cat":"普通饮品","alc":"含酒精","glass":"Cocktail Glass","tags":[],"cost":[6.9,13.3],"img":"img/11391.jpg","ings":[{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"菠萝汁","m":"4 chunks","t":"饮料","k":"pineapple-juice"},{"zh":"青柠","m":"1 tblsp","t":"水果","k":"lime"},{"zh":"糖浆","m":"1/2 tsp","t":"糖浆","k":"syrup"}],"steps":["将所有配料与1杯碎冰放入电动搅拌机中混合。低速短时搅打。倒入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"12670","cn":"水果冷却器","en":"Fruit Cooler","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[28.5,90.9],"img":"img/12670.jpg","ings":[{"zh":"冰块","m":"1 can frozen","t":"其他","k":"ice"},{"zh":"草莓","m":"1 cup","t":"水果","k":"x:草莓"},{"zh":"糖浆","m":"2 tblsp","t":"糖浆","k":"syrup"},{"zh":"柠檬","m":"1","t":"水果","k":"lemon"},{"zh":"苹果","m":"1","t":"水果","k":"x:苹果"},{"zh":"苏打水","m":"1 L","t":"饮料","k":"soda"},{"zh":"冰块","m":"","t":"其他","k":"ice"}],"steps":["将草莓与糖拌匀，放入冰箱静置一夜。切开柠檬，留出两片。其余榨汁。将柠檬汁、草莓、苹果汁和苏打水混合在一起。加入柠檬片（其实只是装饰）。在玻璃杯中放入冰块和一片苹果。倒入饮品，即可上桌。"],"tip":"" baileys"},{"zh":"浓缩咖啡","m":"","t":"饮料","k":"espresso"}],"steps":["将威士忌和百利甜酒倒入啤酒杯（至少 50 cl）中混合。用咖啡补满杯中剩余部分。"],"tip":""},{"id":"178313","cn":"万圣节潘趣","en":"Halloween Punch","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Punch bowl","tags":["Halloween"],"cost":[394.8,946.1],"img":"img/178313.jpg","ings":[{"zh":"酒渍樱桃","m":"1 bottle","t":"水果","k":"cherry"},{"zh":"橙汁","m":"3","t":"饮料","k":"orange-juice"},{"zh":"红辣椒碎","m":"1","t":"","k":"x:红辣椒碎"},{"zh":"肉豆蔻/肉桂粉","m":"10","t":"调料","k":"nutmeg"},{"zh":"姜汁啤酒/干姜水","m":"6","t":"饮料","k":"ginger-beer"},{"zh":"伏特加","m":"20 cl","t":"酒","k":"vodka"}],"steps":["将樱桃汁、橙皮、辣椒、肉桂棒、丁香和姜放入大号平底锅中。小火慢煮5分钟，然后关火。静置冷却，再冷藏至少4小时，最多可冷藏2天——放置时间越长，风味越浓郁。如果给幼儿饮用，几小时后请将辣椒取出。准备上桌时，将果汁倒入壶中。可用玻璃瓶或玻璃杯盛装，每杯插一根吸管。如果要加伏特加，此时加入。每只杯沿挂一颗獠牙形糖果。"],"tip":""},{"id":"12766","cn":"快乐船长","en":"Happy Skipper","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[1.5,2.8],"img":"img/12766.jpg","ings":[{"zh":"黑朗姆/深色朗姆","m":"1 1/2 cl","t":"酒","k":"dark-rum"},{"zh":"姜汁啤酒/干姜水","m":"","t":"饮料","k":"ginger-beer"},{"zh":"青柠","m":"","t":"水果","k":"lime"},{"zh":"冰块","m":"","t":"其他","k":"ice"}],"steps":["将摩根船长香料朗姆酒倒在冰上，用姜汁汽水补满杯中。饰以青柠。口感如奶油苏打水。因《吉利根岛》的梗而得名（《姜汁里的船长》是一出快乐的船长！）"],"tip":""},{"id":"11462","cn":"哈维撞墙","en":"Harvey Wallbanger","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":["IBA","ContemporaryClassic"],"cost":[3.8,8.5],"img":"img/11462.jpg","ings":[{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"加里亚诺","m":"1/2 oz","t":"","k":"x:加里亚诺"},{"zh":"橙汁","m":"4 oz","t":"饮料","k":"orange-juice"}],"steps":["将伏特加和橙汁加冰在杯中搅拌，然后在表面漂浮加利安奴。装饰后奉客。"],"tip":""},{"id":"11470","cn":"哈瓦那的鸡尾酒","en":"Havana Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[12.7,24.9],"img":"img/11470.jpg","ings":[{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"},{"zh":"菠萝汁","m":"1 oz","t":"饮料","k":"pineapple-juice"},{"zh":"柠檬","m":"1 tsp","t":"水果","k":"lemon"}],"steps":["在装有半杯冰块儿的摇酒壶中，加入所有配料。充分摇和。滤入鸡尾酒杯。"],"tip":""},{"id":"11472","cn":"夏威夷鸡尾酒","en":"Hawaiian Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[3.0,4.9],"img":"img/11472.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"1/2 oz","t":"酒","k":"cointreau"},{"zh":"菠萝汁","m":"1 tblsp","t":"饮料","k":"pineapple-juice"}],"steps":["将所有配料加冰摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"15813","cn":"草本火焰","en":"Herbal flame","cat":"咖啡/茶","alc":"含酒精","glass":"Mason jar","tags":[],"cost":null,"img":"img/15813.jpg","ings":[{"zh":"热的","m":"5 shots","t":"","k":"x:热的"},{"zh":"茶","m":"very sweet","t":"饮料","k":"x:茶"}],"steps":["将Hot Damn 100倒入罐子或普通杯子的底部。用甜茶补满杯子余下部分。用勺子、吸管，或者更好用一根肉桂棒搅拌，并把它留在杯中。"],"tip":""},{"id":"11476","cn":"高地飞舞鸡尾酒","en":"Highland Fling Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[8.2,17.2],"img":"img/11476.jpg","ings":[{"zh":"苏格兰威士忌","m":"1 1/2 oz","t":"酒","k":"scotch"},{"zh":"甜味美思（红）","m":"3/4 oz","t":"酒","k":"sweet-vermouth"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"},{"zh":"青橄榄","m":"1","t":"植物材料","k":"olive"}],"steps":["Stir all ingredients (except olive) with ice and strain into a cocktail glass. Add the olive and serve."],"tip":""},{"id":"12954","cn":"万圣节总是打","en":"Holloween Punch","cat":"潘趣/派对饮品","alc":"无酒精","glass":"Punch bowl","tags":[],"cost":null,"img":"img/12954.jpg","ings":[{"zh":"冰块","m":"","t":"其他","k":"ice"},{"zh":"碳酸饮料","m":", orange","t":"","k":"x:碳酸饮料"},{"zh":"雪葩","m":"","t":"","k":"x:雪葩"},{"zh":"雪葩","m":"","t":"","k":"x:雪葩"}],"steps":["拿一堆葡萄汁和一堆气泡饮料（苏打水、姜汁汽水、柠檬青柠汽水，随便什么都行）。把它们在潘趣酒碗里混合。取橙子雪葩和青柠雪葩。舀出一个个雪葩球，让它们漂浮在潘趣酒上，稍微融化一点，好让一层讨厌的薄膜铺满整碗酒表面，但酒里仍然有气泡，以雪葩球的形式冒出来。看着很糟糕，喝起来却挺好。"],"tip":""},{"id":"17044","cn":"自制咖啡酒","en":"Homemade Kahlua","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[8.5,21.8],"img":"img/17044.jpg","ings":[{"zh":"糖浆","m":"2 1/2 cups","t":"糖浆","k":"syrup"},{"zh":"玉米糖浆","m":"1 cup","t":"糖浆","k":"syrup"},{"zh":"浓缩咖啡","m":"1 1/2 oz instant","t":"饮料","k":"espresso"},{"zh":"香草精","m":"2 oz","t":"","k":"x:香草精"},{"zh":"水","m":"3 cups boiling","t":"饮料"
