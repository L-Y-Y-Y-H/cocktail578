"t":"酒","k":"coffee-liqueur"},{"zh":"白兰地/干邑","m":"1/2 oz","t":"酒","k":"brandy"},{"zh":"浓缩咖啡","m":"","t":"饮料","k":"espresso"}],"steps":["搅拌。在表面加入打发奶油。"],"tip":""},{"id":"15026","cn":"快吻我","en":"Kiss me Quick","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[7.2,23.7],"img":"img/15026.jpg","ings":[{"zh":"伏特加","m":"4 cl","t":"酒","k":"vodka"},{"zh":"苹果谷物酒","m":"2 cl","t":"水果","k":"x:苹果谷物酒"},{"zh":"百利Russchian","m":"7 cl","t":"","k":"x:百利Russchian"},{"zh":"冰块","m":"8 cl","t":"其他","k":"ice"},{"zh":"冰块","m":"cubes","t":"其他","k":"ice"}],"steps":["在杯中混合"],"tip":""},{"id":"14752","cn":"奇异果柠檬","en":"Kiwi Lemon","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[120.0,240.2],"img":"img/14752.jpg","ings":[{"zh":"Kiwi liqueur","m":"1 part","t":"酒","k":"x:Kiwi liqueur"},{"zh":"柠檬","m":"2 parts","t":"水果","k":"lemon"},{"zh":"冰块","m":"cubes","t":"其他","k":"ice"}],"steps":["在高球杯中混合。搅拌。以猕猴桃片装饰。"],"tip":""},{"id":"178359","cn":"奇异果马天尼","en":"Kiwi Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["Green","Sharp"],"cost":[3.8,8.8],"img":"img/178359.jpg","ings":[{"zh":"猕猴桃","m":"1/2","t":"","k":"x:猕猴桃"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"伏特加","m":"1 1/2 oz","t":"酒","k":"vodka"},{"zh":"猕猴桃","m":"Garnish with","t":"","k":"x:猕猴桃"}],"steps":["猕猴桃马天尼是一款非常有趣的伏特加鸡尾酒，也是最能利用新鲜水果的饮品之一。虽然流传着好几个配方，但这是最简单的一款，也是一杯绝对令人愉悦的绿色马天尼。制作这款酒时，你只需把猕猴桃片与糖浆一起捣压，然后与伏特加摇和。这是一款任何人都能在几分钟内调好的酒，也是展示你最爱的伏特加的完美鸡尾酒。"],"tip":""},{"id":"12714","cn":"猕猴桃木瓜奶昔","en":"Kiwi Papaya Smoothie","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":null,"img":"img/12714.jpg","ings":[{"zh":"猕猴桃","m":"3","t":"","k":"x:猕猴桃"},{"zh":"Papaya","m":"1/2","t":"","k":"x:Papaya"}],"steps":["把所有材料扔进搅拌机，搅打至液化。"],"tip":""},{"id":"17006","cn":"酷爱急救","en":"Kool First Aid","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[4.7,8.7],"img":"img/17006.jpg","ings":[{"zh":"白朗姆","m":"2 oz light","t":"酒","k":"white-rum"},{"zh":"Kool-Aid","m":"1/2 tsp Tropical","t":"","k":"x:Kool-Aid"}],"steps":["将酷爱饮料粉加入双份子弹杯中，补满朗姆酒。一口闷下。"],"tip":""},{"id":"13190","cn":"温柔地拍摄","en":"Kool-Aid Shot","cat":"烈酒一口杯","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[16.2,29.2],"img":"img/13190.jpg","ings":[{"zh":"伏特加","m":"1 shot","t":"酒","k":"vodka"},{"zh":"杏仁利口酒","m":"1 shot","t":"酒","k":"amaretto"},{"zh":"黑刺李金酒","m":"1 shot","t":"酒","k":"gin"},{"zh":"君度/三重橙酒","m":"1 shot","t":"酒","k":"cointreau"},{"zh":"蔓越莓汁","m":"","t":"饮料","k":"cranberry-juice"}],"steps":["倒入加冰的大杯中，搅拌。依口味加入少许蔓越莓汁。"],"tip":""},{"id":"14446","cn":"冲剂在监狱","en":"Kool-Aid Slammer","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[1.2,2.8],"img":"img/14446.jpg","ings":[{"zh":"Kool-Aid","m":"1/2 oz Grape","t":"","k":"x:Kool-Aid"},{"zh":"伏特加","m":"1/2 oz","t":"酒","k":"vodka"}],"steps":["Fill half the shot glass with the kool-aid first. Then put a paper towel over the top of the glass and slowly pour in the vodka. If you do it right, you should be able to see that the two liquids are separated, with the vodka on top. Now slam it! The last thing you'll taste is the kool-aid."],"tip":""},{"id":"14456","cn":"Kurant茶","en":"Kurant Tea","cat":"咖啡/茶","alc":"含酒精","glass":"Champagne flute","tags":[],"cost":null,"img":"img/14456.jpg","ings":[{"zh":"绝对伏特加Kurant","m":"4 cl","t":"酒","k":"vodka"},{"zh":"茶","m":"Turkish apple","t":"饮料","k":"x:茶"},{"zh":"糖浆","m":"(if needed)","t":"糖浆","k":"syrup"}],"steps":["将绝对伏特加黑加仑倒入一个大一些的茶杯中。加入不要太烫（！）的苹果茶，如果喜欢还可以加些糖。享用吧！"],"tip":""},{"id":"11634","cn":"Lady Love Fizz","en":"Lady Love Fizz","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[2.7,5.5],"img":"img/11634.jpg","ings":[{"zh":"金酒","m":"2 oz","t":"酒","k":"gin"},{"zh":"淡奶油/牛奶","m":"2 tsp","t":"饮料","k":"cream"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"蛋白","m":"1","t":"其他","k":"egg-white"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"}],"steps":["将除苏打水外的所有配料与冰块一起摇和，滤入放有两块冰块的鸡尾酒杯中。补满苏打水，搅拌，即可饮用。"],"tip":""},{"id":"12690","cn":"Lassi - A South Indian Drink","en":"Lassi - A South Indian Drink","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[6.2,12.5],"img":"img/12690.jpg","ings":[{"zh":"酸奶","m":"1/2 cup plain","t":"饮料","k":"x:酸奶"},{"zh":"水","m":"1 1/4 cup cold","t":"饮料","k":"x:水"},{"zh":"孜然种子","m":"1/2 tsp ground roasted","t":"","k":"x:孜然种子"},{"zh":"盐","m":"1/4 tsp","t":"调料","k":"salt"},{"zh":"薄荷","m":"1/4 tsp dried","t":"植物材料","k":"mint"}],"steps":["用搅拌机搅打3秒。拉西（Lassi）是最容易制作的饮品之一，做法多种多样。基本上，它就是酪乳（用水搅打酸奶制成），浓稠度几乎可随个人喜好选择，从最稀到最稠皆可。冰镇后饮用。"],"tip":""},{"id":"12698","cn":"芒果拉西","en":"Lassi - Mango","cat":"其他/不详","alc":"无酒精","glass":"Highball glass","tags":[],"cost":[5.1,11.8],"img":"img/12698.jpg","ings":[{"zh":"芒果","m":"2","t":"水果","k":"x:芒果"},{"zh":"酸奶","m":"2 cups","t":"饮料","k":"x:酸奶"},{"zh":"糖浆","m":"1/2 cup","t":"糖浆","k":"syrup"},{"zh":"水","m":"1 cup iced","t":"饮料","k":"x:水"}],"steps":["将所有材料放入搅拌机中搅打，然后倒在碎冰上。你也可以使用草莓、香蕉等其他水果。"],"tip":""},{"id":"12696","cn":"莱西-甜","en":"Lassi - Sweet","cat":"其他/不详","alc":"无酒精","glass":"Highball glass","tags":[],"cost":[9.1,19.9],"img":"img/12696.jpg","ings":[{"zh":"酸奶","m":"1 cup","t":"饮料","k":"x:酸奶"},{"zh":"水","m":"2 cups cold","t":"饮料","k":"x:水"},{"zh":"糖浆","m":"4 tblsp","t":"糖浆","k":"syrup"},{"zh":"盐","m":"pinch","t":"调料","k":"salt"},{"zh":"柠檬","m":"2 tblsp","t":"水果","k":"lemon"}],"steps":["将所有原料放入搅拌机，搅打至细腻起泡。冰镇后饮用。"],"tip":""},{"id":"12692","cn":"颓唐和","en":"Lassi Khara","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[0.2,0.7],"img":"img/12692.jpg","ings":[{"zh":"酸奶","m":"1 cup","t":"饮料","k":"x:酸奶"},{"zh":"水","m":"2 cups cold","t":"饮料","k":"x:水"},{"zh":"盐","m":"1 tsp","t":"调料","k":"salt"},{"zh":"阿魏","m":"1 pinch","t":"","k":"x:阿魏"}],"steps":["在搅拌机中搅打（打成冰沙状）至起泡。加入撕碎的咖喱叶，冷饮。"],"tip":""},{"id":"12694","cn":"酪沙拉","en":"Lassi Raita","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[0.2,0.8],"img":"img/12694.jpg","ings":[{"zh":"酸奶","m":"2 cups","t":"饮料","k":"x:酸奶"},{"zh":"冰块","m":"4-6","t":"其他","k":"ice"},{"zh":"糖浆","m":"","t":"糖浆","k":"syrup"},{"zh":"青柠","m":"","t":"水果","k":"lime"},{"zh":"盐","m":"","t":"调料","k":"salt"}],"steps":["将酸奶与冰块一起搅打，直至酸奶变得更加液态。按口味加糖。柠檬/青柠并非必需，但能让味道略带酸味。加一滴盐。雷塔（Raita）也很适合夏天。可以不做传统沙拉，改做雷塔。"],"tip":""},{"id":"178335","cn":"慵懒椰香帕洛玛","en":"Lazy Coconut Paloma","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":["Lazy","Sharp"],"cost":[1.5,3.0],"img":"img/178335.jpg","ings":[{"zh":"椰浆/椰奶","m":"30 ml","t":"饮料","k":"coconut-cream"},{"zh":"西柚汽水/西柚汁","m":"75 ml","t":"饮料","k":"grapefruit-soda"},{"zh":"苏打水","m":"Top","t":"饮料","k":"soda"}],"steps":["将椰子利口酒（最好是龙舌兰酒）与西柚汁混合，用苏打水补满。以一大片西柚片贴着玻璃杯内侧装饰。"],"tip":""},{"id":"178360","cn":"柠檬接骨木花气泡饮","en":"Lemon Elderflower Spritzer","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":["Summer","Fresh","Refreshing"],"cost":[6.1,13.5],"img":"img/178360.jpg","ings":[{"zh":"接骨木花糖浆","m":"2 tsp","t":"糖浆","k":"syrup"},{"zh":"伏特加","m":"1 shot","t":"酒","k":"vodka"},{"zh":"苏打水","m":"1/3 cup","t":"饮料","k":"soda"},{"zh":"柠檬","m":"Top","t":"水果","k":"lemon"}],"steps":["将所有配料倒在冰块上，搅拌即可享用！"],"tip":""},{"id":"12752","cn":"柠檬子弹","en":"Lemon Shot","cat":"烈酒一口杯","alc":"含酒精","glass":"Shot glass","tags":[],"cost":[2.0,4.0],"img":"img/12752.jpg","ings":[{"zh":"加里亚诺","m":"1/2 oz","t":"","k":"x:加里亚诺"},{"zh":"绝对伏特加柠檬味","m":"1/2 oz","t":"酒","k":"vodka"},{"zh":"柠檬","m":"wedge","t":"水果","k":"lemon"},{"zh":"糖浆","m":"Bacardi","t":"糖浆","k":"syrup"},{"zh":"白朗姆","m":"","t":"酒","k":"white-rum"}],"steps":["在子弹杯中混合加利安奴和绝对伏特加，将撒了糖的柠檬角搭在杯口，再把朗姆酒浇在柠檬角和杯口上。用打火机点燃朗姆酒，任其燃烧一秒。迅速饮下，并吸吮柠檬。若操作正确，喝起来会像一杯甜柠檬水。"],"tip":""},{"id":"12702","cn":"Lemouroudji","en":"Lemouroudji","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[12.2,27.7],"img":"img/12702.jpg","ings":[{"zh":"姜汁啤酒/干姜水","m":"2 pieces","t":"饮料","k":"ginger-beer"},{"zh":"水","m":"1 gal","t":"饮料","k":"x:水"},{"zh":"柠檬","m":"1 lb","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 cup","t":"糖浆","k":"syrup"},{"zh":"黑胡椒","m":"ground","t":"调料","k":"pepper"}],"steps":["榨柠檬汁。姜去皮，磨碎。把磨碎的姜和少量的辣椒放在一块粗棉布上，打个结。让它泡在水里。大约15分钟后，加入糖和柠檬汁。放凉，上桌。"],"tip":""},{"id":"12704","cn":"酸橙汽水","en":"Limeade","cat":"其他/不详","alc":"无酒精","glass":"Highball glass","tags":[],"cost":[2.8,6.0],"img":"img/12704.jpg","ings":[{"zh":"青柠","m":"Juice of 1","t":"水果","k":"lime"},{"zh":"糖浆","m":"1 tblsp","t":"糖浆","k":"syrup"},{"zh":"苏打水","m":"(seltzer water)","t":"饮料","k":"soda"},{"zh":"青柠","m":"","t":"水果","k":"lime"}],"steps":["在一个大杯子里，放入酸橙汁和糖，搅拌均匀。加入冷苏打水填充。把柠檬皮放进玻璃杯里。饮料。重复这个过程，直到酸橙或苏打水用完。"],"tip":""},{"id":"15086","cn":"Limona电晕","en":"Limona Corona","cat":"啤酒","alc":"含酒精","glass":"Beer Glass","tags":[],"cost":null,"img":"img/15086.jpg","ings":[{"zh":"Corona","m":"1 bottle","t":"","k":"x:Corona"},{"zh":"巴卡第利","m":"1 oz","t":"","k":"x:巴卡第利"}],"steps":["打开科罗娜啤酒。用朗姆酒把瓶颈处的空隙填满。酒瓶应填至瓶口。用拇指或手掌堵住瓶口。将酒瓶倒转，使朗姆酒与啤酒混合。把酒瓶转正，拔出瓶塞，饮用。"],"tip":""},{"id":"11658","cn":"洛蒙德湖","en":"Loch Lomond","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[8.8,19.0],"img":"img/11658.jpg","ings":[{"zh":"苏格兰威士忌","m":"2 oz","t":"酒","k":"scotch"},{"zh":"Drambuie","m":"1/2 oz","t":"","k":"x:Drambuie"},{"zh":"干味美思（白）","m":"1/2 oz","t":"酒","k":"dry-vermouth"},{"zh":"柠檬","m":"1 twist of","t":"水果","k":"lemon"}],"steps":["在装半杯冰块的调酒杯中，加入苏格兰威士忌、杜林标酒和味美思，充分搅拌，滤入鸡尾酒杯，用柠檬皮扭条装饰。"],"tip":""},{"id":"11662","cn":"伦敦城","en":"London Town","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[3.0,5.0],"img":"img/11662.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"樱桃白兰地/樱桃酒","m":"1/2 oz","t":"酒","k":"cherry-brandy"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"}],"steps":["在装半杯冰块的调酒杯中，加入所有原料，充分搅拌，滤入鸡尾酒杯。"],"tip":""},{"id":"11664","cn":"孤树鸡尾酒","en":"Lone Tree Cocktail","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[1.8,3.1],"img":"img/11664.jpg","ings":[{"zh":"甜味美思（红）","m":"3/4 oz","t":"酒","k":"sweet-vermouth"},{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"}],"steps":["将配料加冰搅拌，滤入鸡尾酒杯，即可享用。"],"tip":""},{"id":"11666","cn":"孤树冷却器","en":"Lone Tree Cooler","cat":"普通饮品","alc":"含酒精","glass":"Collins glass","tags":[],"cost":null,"img":"img/11666.jpg","ings":[{"zh":"苏打水","m":"","t":"饮料","k":"soda"},{"zh":"金酒","m":"","t":"酒","k":"gin"},{"zh":"干味美思（白）","m":"","t":"酒","k":"dry-vermouth"},{"zh":"糖浆","m":"","t":"糖浆","k":"syrup"},{"zh":"橙汁","m":"","t":"饮料","k":"orange-juice"},{"zh":"柠檬","m":"","t":"水果","k":"lemon"}],"steps":["在柯林杯中搅拌糖粉和2盎司苏打水。向杯中加满冰块，加入金酒和味美思，搅拌均匀。补满苏打水，再次搅拌。加入柠檬皮卷和橙皮螺旋，使末端垂挂在杯沿外。"],"tip":""},{"id":"13196","cn":"长伏特加","en":"Long vodka","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[15.8,33.2],"img":"img/13196.jpg","ings":[{"zh":"伏特加","m":"5 cl","t":"酒","k":"vodka"},{"zh":"青柠","m":"1/2","t":"水果","k":"lime"},{"zh":"安高天娜苦精","m":"4 dashes","t":"酒","k":"bitters"},{"zh":"汤力水","m":"1 dl Schweppes","t":"饮料","k":"tonic"},{"zh":"冰块","m":"4","t":"其他","k":"ice"}],"steps":["在高脚杯中放入冰块和安高天娜苦精，摇和，使杯壁内侧均匀沾附。将伏特加倒入杯中，加入 1 片青柠，并将剩余青柠挤汁入杯，用汤力水兑和，搅拌，瞧，一杯长岛伏特加就做好了"],"tip":""},{"id":"11670","cn":"勋爵与夫人","en":"Lord And Lady","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[6.3,11.4],"img":"img/11670.jpg","ings":[{"zh":"黑朗姆/深色朗姆","m":"1 1/2 oz","t":"酒","k":"dark-rum"},{"zh":"咖啡利口酒","m":"1/2 oz","t":"酒","k":"coffee-liqueur"}],"steps":["将朗姆酒和添万利咖啡利口酒倒入几乎装满冰块的古典杯中。充分搅拌。"],"tip":""},{"id":"14378","cn":"午餐盒","en":"Lunch Box","cat":"啤酒","alc":"含酒精","glass":"Pint glass","tags":[],"cost":[5.4,9.6],"img":"img/14378.jpg","ings":[{"zh":"啤酒","m":"3/4 bottle","t":"饮料","k":"ginger-beer"},{"zh":"杏仁利口酒","m":"1 shot","t":"酒","k":"amaretto"},{"zh":"橙汁","m":"1 oz","t":"饮料","k":"orange-juice"}],"steps":["把一品脱的玻璃杯装满啤酒。然后用橙汁填满剩下的部分（注意不要填满）。然后把苦杏仁酒倒进去。"],"tip":""},{"id":"15224","cn":"马里布捻线机","en":"Malibu Twister","cat":"鸡尾酒","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[5.2,9.7],"img":"img/15224.jpg","ings":[{"zh":"白朗姆","m":"2 parts","t":"酒","k":"white-rum"},{"zh":"纯果乐","m":"2 parts","t":"","k":"x:纯果乐"},{"zh":"蔓越莓汁","m":"1 part","t":"饮料","k":"cranberry-juice"}],"steps":["加入朗姆酒和triple sec，然后加入蔓越莓汁，搅拌。"],"tip":""},{"id":"178358","cn":"芒果莫吉托","en":"Mango Mojito","cat":"鸡尾酒","alc":"含酒精","glass":"Jar","tags":["Fruity"],"cost":[25.6,48.5],"img":"img/178358.jpg","ings":[{"zh":"青柠","m":"3","t":"水果","k":"lime"},{"zh":"芒果","m":"1 Fresh","t":"水果","k":"x:芒果"},{"zh":"薄荷","m":"Sprig","t":"植物材料","k":"mint"},{"zh":"白朗姆","m":"200 ml","t":"酒","k":"white-rum"},{"zh":"冰块","m":"cubes","t":"其他","k":"ice"},{"zh":"苏打水","m":"Top","t":"饮料","k":"soda"},{"zh":"芒果","m":"Garnish with","t":"水果","k":"x:芒果"}],"steps":["Squeeze the juice from 1½ limes and blend with the mango to give a smooth purée.\nCut the rest of the limes into quarters, and then cut each wedge in half again. Put 2 pieces of lime in a highball glass for each person and add 1 teaspoon of caster sugar and 5-6 mint leaves to each glass. Squish everything together with a muddler or the end of a rolling pin to release all the flavours from the lime and mint.\nDivide the mango purée between the glasses and add 30ml white rum and a handful of crushed ice to each one, stirring well to mix everything together. Top up with soda water to serve and garnish with extra mint, if you like."],"tip":""},{"id":"12716","cn":"芒果橙冰沙","en":"Mango Orange Smoothie","cat":"其他/不详","alc":"无酒精","glass":"Highball Glass","tags":[],"cost":[0.7,1.5],"img":"img/12716.jpg","ings":[{"zh":"芒果","m":"1","t":"水果","k":"x:芒果"},{"zh":"橙汁","m":"2","t":"饮料","k":"orange-juice"}],"steps":["把所有材料扔进搅拌机，搅打至液化。"],"tip":""},{"id":"17256","cn":"马丁内斯2","en":"Martinez 2","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[4.8,8.4],"img":"img/17256.jpg","ings":[{"zh":"金酒","m":"1 1/2 oz","t":"酒","k":"gin"},{"zh":"甜味美思（红）","m":"1 1/2 oz","t":"酒","k":"sweet-vermouth"},{"zh":"樱桃白兰地/樱桃酒","m":"1 tsp","t":"酒","k":"cherry-brandy"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"}],"steps":["将全部原料放入调酒杯中，加满冰块。搅拌至冰镇，滤入冰镇的碟形香槟杯。"],"tip":""},{"id":"11720","cn":"马丁内斯鸡尾酒","en":"Martinez Cocktail","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[3.3,6.1],"img":"img/11720.jpg","ings":[{"zh":"金酒","m":"1 oz","t":"酒","k":"gin"},{"zh":"干味美思（白）","m":"1 oz","t":"酒","k":"dry-vermouth"},{"zh":"君度/三重橙酒","m":"1/4 tsp","t":"酒","k":"cointreau"},{"zh":"安高天娜苦精","m":"1 dash","t":"酒","k":"bitters"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["Stir all ingredients (except cherry) with ice and strain into a cocktail glass. Top with the cherry and serve."],"tip":""},{"id":"11728","cn":"马天尼","en":"Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[1.1,2.0],"img":"img/11728.jpg","ings":[{"zh":"金酒","m":"1 2/3 oz","t":"酒","k":"gin"},{"zh":"干味美思（白）","m":"1/3 oz","t":"酒","k":"dry-vermouth"},{"zh":"青橄榄","m":"1","t":"植物材料","k":"olive"}],"steps":["纯饮：将所有材料加冰块倒入调酒杯中。充分搅拌。滤入冰镇的马天尼鸡尾酒杯。将柠檬皮中的精油挤压到酒液上，或用橄榄装饰。"],"tip":""},{"id":"17188","cn":"玛丽·皮克福德","en":"Mary Pickford","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA","Classic"],"cost":[5.1,9.6],"img":"img/17188.jpg","ings":[{"zh":"白朗姆","m":"1 1/2 oz","t":"酒","k":"white-rum"},{"zh":"菠萝汁","m":"1 oz","t":"饮料","k":"pineapple-juice"},{"zh":"樱桃白兰地/樱桃酒","m":"1/2 tsp","t":"酒","k":"cherry-brandy"},{"zh":"石榴糖浆","m":"1/2 tsp","t":"糖浆","k":"grenadine"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["摇和并滤入冰镇的大号鸡尾酒杯中。"],"tip":""},{"id":"12774","cn":"玛莎拉茶","en":"Masala Chai","cat":"咖啡/茶","alc":"无酒精","glass":"Coffee Mug","tags":[],"cost":[0.7,1.9],"img":"img/12774.jpg","ings":[{"zh":"水","m":"2 cups","t":"饮料","k":"x:水"},{"zh":"茶","m":"3-4 tsp","t":"饮料","k":"x:茶"},{"zh":"姜汁啤酒/干姜水","m":"1 chunk dried","t":"饮料","k":"ginger-beer"},{"zh":"Cardamom","m":"3-4 crushed","t":"","k":"x:Cardamom"},{"zh":"肉豆蔻/肉桂粉","m":"3","t":"调料","k":"nutmeg"},{"zh":"肉豆蔻/肉桂粉","m":"1 piece","t":"调料","k":"nutmeg"},{"zh":"黑胡椒","m":"1-2 whole","t":"调料","k":"pepper"},{"zh":"糖浆","m":"to taste","t":"糖浆","k":"syrup"},{"zh":"淡奶油/牛奶","m":"to taste","t":"饮料","k":"cream"}],"steps":["将2杯水煮沸。加入所有原料，再煮约15秒。静置一分钟。在锅中加热牛奶。将茶滤入杯中。加入牛奶和糖。就这样。"],"tip":""},{"id":"178370","cn":"莫雷斯克","en":"Mauresque","cat":"鸡尾酒","alc":"含酒精","glass":"Collins glass","tags":[],"cost":[0.9,1.4],"img":"img/178370.jpg","ings":[{"zh":"里卡德","m":"3 cl","t":"","k":"x:里卡德"},{"zh":"杏仁糖浆 Orgeat","m":"1 cl","t":"糖浆","k":"almond-syrup"},{"zh":"水","m":"Full Glass","t":"饮料","k":"x:水"}],"steps":["1 - 倒入茴香酒（或帕斯蒂斯）。2 - 倒入杏仁糖浆。3 - 最后倒入水，并按个人喜好加入冰块。冰块要最后加入，否则糖浆与茴香酒无法充分融合。"],"tip":""},{"id":"12776","cn":"Melya","en":"Melya","cat":"咖啡/茶","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":null,"img":"img/12776.jpg","ings":[{"zh":"浓缩咖啡","m":"","t":"饮料","k":"espresso"},{"zh":"蜂蜜","m":"Unsweetened","t":"糖浆","k":"x:蜂蜜"},{"zh":"Cocoa powder","m":"","t":"","k":"x:Cocoa powder"}],"steps":["酿造咖啡。在咖啡杯里放一茶匙无糖可可粉，然后在一茶匙上撒上蜂蜜，然后把它洒在杯子里。一边搅拌一边煮咖啡，这是有趣的部分。可可似乎没有混合就覆盖在蜂蜜上，所以你得到的是一团灰尘，粘稠的东西，看起来好像永远不会混合。然后突然之间，快！看起来像黑巧克力酱。将热浓咖啡倒入蜂蜜中，搅拌至溶解。配上奶油。"],"tip":""},{"id":"13936","cn":"迈阿密风云","en":"Miami Vice","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":["IBA"],"cost":[11.8,21.7],"img":"img/13936.jpg","ings":[{"zh":"白朗姆","m":"5 oz Bacardi","t":"酒","k":"white-rum"},{"zh":"可乐","m":"frozen","t":"饮料","k":"cola"},{"zh":"代基里酒混合","m":"frozen","t":"","k":"x:代基里酒混合"}],"steps":["First: Mix pina colada with 2.5 oz. of rum with ice(set aside). Second: Mix daiquiri with 2.5 oz. of rum with ice. Third: While frozen, add pina colda mix then daiquiri mix in glass (Making sure they do not get mixed together)."],"tip":""},{"id":"12744","cn":"微波热可可","en":"Microwave Hot Cocoa","cat":"可可饮品","alc":"无酒精","glass":"Coffee mug","tags":[],"cost":[9.2,20.8],"img":"img/12744.jpg","ings":[{"zh":"糖浆","m":"5 tblsp","t":"糖浆","k":"syrup"},{"zh":"Cocoa powder","m":"3 tblsp","t":"","k":"x:Cocoa powder"},{"zh":"盐","m":"1 dash","t":"调料","k":"salt"},{"zh":"水","m":"3 tblsp hot","t":"饮料","k":"x:水"},{"zh":"淡奶油/牛奶","m":"2 cups","t":"饮料","k":"cream"},{"zh":"香草精","m":"1/4 tsp","t":"","k":"x:香草精"}],"steps":["将糖、可可粉、盐和热水放入 1 夸脱容量的微波炉适用量杯（或咖啡杯）中。以高火（100%）微波加热 1 至 1 1/2 分钟，或至沸腾。加入牛奶，搅拌，再微波加热 1 1/2 至 2 分钟，或至热透。拌入香草精，充分融合。"],"tip":""},{"id":"11766","cn":"午夜牛仔","en":"Midnight Cowboy","cat":"普通 ball 杯中，顶部补上起泡酒。"],"tip":""},{"id":"17233","cn":"咸焦糖太妃马天尼","en":"Salted Toffee Martini","cat":"鸡尾酒","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[2.0,3.5],"img":"img/17233.jpg","ings":[{"zh":"金酒","m":"50 ml","t":"酒","k":"gin"},{"zh":"可乐","m":"30 ml","t":"饮料","k":"cola"},{"zh":"杏仁利口酒","m":"15 ml","t":"酒","k":"amaretto"},{"zh":"可乐","m":"Garnish","t":"饮料","k":"cola"},{"zh":"可乐","m":"Grated","t":"饮料","k":"cola"}],"steps":["将冰块、太妃金酒、巧克力利口酒和阿玛雷托杏仁利口酒加入鸡尾酒摇壶中，用力摇和。将巧克力糖浆倒入小碟中，把马天尼杯的杯口浸入酱汁。将一些Willie's海盐巧克力磨碎放入另一只小碟，把沾过酱汁的杯口浸入其中，使巧克力碎屑粘在酱汁上，形成巧克力杯边！将摇壶中的内容物倒入巧克力杯边的杯中，再撒上更多巧克力碎屑——尽情享用！"],"tip":""},{"id":"15184","cn":"旧金山","en":"San Francisco","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[1.6,3.7],"img":"img/15184.jpg","ings":[{"zh":"伏特加","m":"2 cl","t":"酒","k":"vodka"},{"zh":"香蕉奶油","m":"2 cl","t":"水果","k":"x:香蕉奶油"},{"zh":"石榴糖浆","m":"","t":"糖浆","k":"grenadine"},{"zh":"橙汁","m":"","t":"饮料","k":"orange-juice"}],"steps":["取一只高杯，放入几块冰块，倒入伏特加没过冰块，再倒入果汁，然后是奶油，最后加入红石榴糖浆，但要非常小心地沿着杯壁倒，让它沉在杯底。用橙子和草莓装饰。"],"tip":""},{"id":"13026","cn":"桑格利亚汽酒","en":"Sangria The  Best","cat":"潘趣/派对饮品","alc":"含酒精","glass":"Pitcher","tags":[],"cost":[37.8,79.1],"img":"img/13026.jpg","ings":[{"zh":"红葡萄酒","m":"1 1/2 L","t":"酒","k":"x:红葡萄酒"},{"zh":"糖浆","m":"1 cup","t":"糖浆","k":"syrup"},{"zh":"柠檬","m":"1 large","t":"水果","k":"lemon"},{"zh":"橙汁","m":"1 large","t":"饮料","k":"orange-juice"},{"zh":"苹果","m":"1 large","t":"水果","k":"x:苹果"},{"zh":"白兰地/干邑","m":"3-4 oz plain","t":"酒","k":"brandy"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"}],"steps":["将葡萄酒，糖和水果混合，放在冰箱里18-24小时。这种混合物会有一些糖浆般的稠度。在上菜之前，加入白兰地，用苏打水搅拌混合物，直到它变得更薄，更像葡萄酒。用大水罐盛在酒杯里。"],"tip":""},{"id":"12130","cn":"踏板车","en":"Scooter","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[11.1,21.5],"img":"img/12130.jpg","ings":[{"zh":"白兰地/干邑","m":"1 oz","t":"酒","k":"brandy"},{"zh":"杏仁利口酒","m":"1 oz","t":"酒","k":"amaretto"},{"zh":"淡奶油/牛奶","m":"1 oz","t":"饮料","k":"cream"}],"steps":["将所有配料加碎冰充分摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"12138","cn":"苏格兰鞋匠","en":"Scotch Cobbler","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[13.4,28.3],"img":"img/12138.jpg","ings":[{"zh":"苏格兰威士忌","m":"2 oz","t":"酒","k":"scotch"},{"zh":"白兰地/干邑","m":"4 dashes","t":"酒","k":"brandy"},{"zh":"君度/三重橙酒","m":"4 dashes","t":"酒","k":"cointreau"},{"zh":"橙汁","m":"1 slice","t":"饮料","k":"orange-juice"},{"zh":"薄荷","m":"1","t":"植物材料","k":"mint"}],"steps":["将苏格兰威士忌、白兰地和库拉索酒倒在冰块上，倒入古典杯中。加入橙片，在表面放上薄荷枝，即可饮用。"],"tip":""},{"id":"12158","cn":"苏格兰威士忌酸","en":"Scotch Sour","cat":"普通饮品","alc":"含酒精","glass":"Whiskey sour glass","tags":[],"cost":[8.1,17.6],"img":"img/12158.jpg","ings":[{"zh":"苏格兰威士忌","m":"1 1/2 oz","t":"酒","k":"scotch"},{"zh":"青柠","m":"Juice of 1/2","t":"水果","k":"lime"},{"zh":"糖浆","m":"1/2 tsp","t":"糖浆","k":"syrup"},{"zh":"柠檬","m":"1/2 slice","t":"水果","k":"lemon"},{"zh":"酒渍樱桃","m":"1","t":"水果","k":"cherry"}],"steps":["将苏格兰威士忌、青柠汁和糖粉加冰摇和，滤入威士忌酸酒杯。用1/2片柠檬装饰，顶部放上樱桃，即可享用。"],"tip":""},{"id":"12854","cn":"苏格兰高地利口酒","en":"Scottish Highland Liqueur","cat":"自制利口酒","alc":"含酒精","glass":"Collins Glass","tags":[],"cost":[4.0,8.0],"img":"img/12854.jpg","ings":[{"zh":"尊尼获加","m":"1 fifth","t":"","k":"x:尊尼获加"},{"zh":"蜂蜜","m":"1 1/2 cup mild","t":"糖浆","k":"x:蜂蜜"},{"zh":"当归的根","m":"2 tsp dried and chopped","t":"","k":"x:当归的根"},{"zh":"茴香籽","m":"1/4 tsp crushed","t":"","k":"x:茴香籽"},{"zh":"柠檬","m":"2 2 inch strips","t":"水果","k":"lemon"}],"steps":["将所有配料放入陈化容器中。盖紧盖子，在最初的24小时内轻轻摇晃几次。24小时后,把柠檬皮。再次盖上盖子，放在阴凉、黑暗的地方放置2周，每隔一天轻轻摇晃一次。用钢丝筛筛出当归根和茴香。放回陈化容器，盖上盖子，在阴凉、黑暗的地方静置6个月。将清澈的利口酒虹吸或倒入无菌瓶中。浑浊的渣滓可留作烹调之用。"],"tip":""},{"id":"13625","cn":"性高潮","en":"Screaming Orgasm","cat":"普通饮品","alc":"含酒精","glass":"Cocktail glass","tags":[],"cost":[10.0,18.2],"img":"img/13625.jpg","ings":[{"zh":"伏特加","m":"1 oz","t":"酒","k":"vodka"},{"zh":"百利甜酒/爱尔兰奶油","m":"1 1/2 oz","t":"酒","k":"baileys"},{"zh":"咖啡利口酒","m":"1/2 oz","t":"酒","k":"coffee-liqueur"}],"steps":["先倒入伏特加，再倒入百利甜酒，然后倒入甘露咖啡利口酒，加碎冰于鸡尾酒杯中。搅拌。注意：仅使用优质伏特加。廉价伏特加会导致百利甜酒凝结。可先各取1茶匙伏特加与百利甜酒混合，测试你所用的伏特加品牌。"],"tip" :"1 1/2 oz","t":"酒","k":"brandy"},{"zh":"橙汁","m":"1 tblsp","t":"饮料","k":"orange-juice"},{"zh":"安高天娜苦精","m":"2 dashes","t":"酒","k":"bitters"}],"steps":["将所有配料加冰摇和，滤入鸡尾酒杯中即可饮用。"],"tip":""},{"id":"17217","cn":"吸血鬼","en":"Vampiro","cat":"普通饮品","alc":"含酒精","glass":"Old-Fashioned glass","tags":["IBA","NewEra"],"cost":[30.4,60.8],"img":"img/17217.jpg","ings":[{"zh":"龙舌兰（银标）","m":"6 cl","t":"酒","k":"tequila"},{"zh":"番茄汁","m":"3 cl","t":"饮料","k":"tomato-juice"},{"zh":"橙汁","m":"3 cl","t":"饮料","k":"orange-juice"},{"zh":"青柠","m":"1.5 cl","t":"水果","k":"lime"},{"zh":"糖浆","m":"1 dash","t":"糖浆","k":"syrup"},{"zh":"盐","m":"1 pinch","t":"调料","k":"salt"}],"steps":["吸血鬼可盛于高杯中，也可盛于古典杯中。调酒师可能会先用犹太盐为杯口挂边，做法是在砧板上铺一层犹太盐，用青柠汁或水润湿杯口，然后将倒扣的杯口按在犹太盐上，使盐粘附在湿润的杯口上。第二步是向杯中加冰至半满，并加入一到两口小酒杯分量的高品质龙舌兰。接下来是加入调味元素。具体做法是向杯中挤入一颗新鲜青柠，加入少许盐粒，倒入柑橘味汽水，直至杯中达到五分之四满，然后加入辛辣的Viuda de Sanchez（或橙汁、青柠汁和皮科德加洛）。最后一步是搅拌各种配料，使风味充分融合。"],"tip":""},{"id":"12436","cn":"范Vleet","en":"Van Vleet","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[66.2,131.3],"img":"img/12436.jpg","ings":[{"zh":"白朗姆","m":"3 oz","t":"酒","k":"white-rum"},{"zh":"枫糖浆","m":"1 oz","t":"糖浆","k":"syrup"},{"zh":"柠檬","m":"1 oz","t":"水果","k":"lemon"}],"steps":["将所有配料加冰摇和，滤入装有方冰的古典杯中即可饮用。"],"tip":""},{"id":"12442","cn":"味美思黑加仑","en":"Vermouth Cassis","cat":"普通饮品","alc":"含酒精","glass":"Highball glass","tags":[],"cost":[3.5,6.2],"img":"img/12442.jpg","ings":[{"zh":"干味美思（白）","m":"1 1/2 oz","t":"酒","k":"dry-vermouth"},{"zh":"黑醋栗奶油","m":"3/4 oz","t":"调料","k":"x:黑醋栗奶油"},{"zh":"苏打水","m":"","t":"饮料","k":"soda"}],"steps":["将味美思和黑加仑利口酒加冰块放入高球杯中搅拌。补满苏打水，再次搅拌，即可奉客。"],"tip":""},{"id":"12444","cn":"维苏威","en":"Vesuvio","cat":"普通饮品","alc":"含酒精","glass":"Old-fashioned glass","tags":[],"cost":[5.8,10.9],"img":"img/12444.jpg","ings":[{"zh":"白朗姆","m":"1 oz","t":"酒","k":"white-rum"},{"zh":"甜味美思（红）","m":"1/2 oz","t":"酒","k":"sweet-vermouth"},{"zh":"柠檬","m":"Juice of 1/2","t":"水果","k":"lemon"},{"zh":"糖浆","m":"1 tsp","t":"糖浆","k":"syrup"},{"zh":"蛋白","m":"1","t" const LIB = {"gin":{"n":"金酒（伦敦干金）","t":"酒","abv":40},"oldtom":{"n":"老汤姆金酒","t":"酒","abv":40},"bourbon":{"n":"波本威士忌","t":"酒","abv":43},"rye":{"n":"黑麦威士忌","t":"酒","abv":45},"scotch":{"n":"苏格兰威士忌","t":"酒","abv":40},"irish":{"n":"爱尔兰威士忌","t":"酒","abv":40},"white-rum":{"n":"白朗姆","t":"酒","abv":40},"dark-rum":{"n":"黑朗姆/深色朗姆","t":"酒","abv":40},"tequila":{"n":"龙舌兰（银标）","t":"酒","abv":38},"vodka":{"n":"伏特加","t":"酒","abv":40},"brandy":{"n":"白兰地/干邑","t":"酒","abv":40},"cachaca":{"n":"卡莎萨","t":"酒","abv":40},"cointreau":{"n":"君度/三重橙酒","t":"酒","abv":40},"campari":{"n":"金巴利","t":"酒","abv":25},"aperol":{"n":"阿佩罗","t":"酒","abv":11},"sweet-vermouth":{"n":"甜味美思（红）","t":"酒","abv":16},"dry-vermouth":{"n":"干味美思（白）","t":"酒","abv":15},"coffee-liqueur":{"n":"咖啡利口酒","t":"酒","abv":16},"cocoa-liqueur":{"n":"可可利口酒","t":"酒","abv":24},"baileys":{"n":"百利甜酒/爱尔兰奶油","t":"酒","abv":17},"peach-liqueur":{"n":"桃味利口酒/蜜桃酒","t":"酒","abv":18},"blue-curacao":{"n":"蓝橙力娇酒","t":"酒","abv":20},"cherry-brandy":{"n":"樱桃白兰地/樱桃酒","t":"酒","abv":24},"benedictine":{"n":"廊酒 Bénédictine","t":"酒","abv":40},"amaretto":{"n":"杏仁利口酒","t":"酒","abv":28},"absinthe":{"n":"苦艾酒","t":"酒","abv":60},"bitters":{"n":"安高天娜苦精","t":"酒","abv":44},"syrup":{"n":"糖浆","t":"糖浆","abv":null},"almond-syrup":{"n":"杏仁糖浆 Orgeat","t":"糖浆","abv":null},"passion-syrup":{"n":"百香果糖浆","t":"糖浆","abv":null},"grenadine":{"n":"石榴糖浆","t":"糖浆","abv":null},"tonic":{"n":"汤力水","t":"饮料","abv":null},"soda":{"n":"苏打水","t":"饮料","abv":null},"ginger-beer":{"n":"姜汁啤酒/干姜水","t":"饮料","abv":null},"cola":{"n":"可乐","t":"饮料","abv":null},"sprite":{"n":"雪碧/柠檬汽水","t":"饮料","abv":null},"grapefruit-soda":{"n":"西柚汽水/西柚汁","t":"饮料","abv":null},"tomato-juice":{"n":"番茄汁","t":"饮料","abv":null},"orange-juice":{"n":"橙汁","t":"饮料","abv":null},"pineapple-juice":{"n":"菠萝汁","t":"饮料","abv":null},"cranberry-juice":{"n":"蔓越莓汁","t":"饮料","abv":null},"coconut-cream":{"n":"椰浆/椰奶","t":"饮料","abv":null},"cream":{"n":"淡奶油/牛奶","t":"饮料","abv":null},"espresso":{"n":"浓缩咖啡","t":"饮料","abv":null},"sparkling":{"n":"起泡酒/香槟","t":"酒","abv":11},"peach-puree":{"n":"白桃泥","t":"水果","abv":null},"lime":{"n":"青柠","t":"水果","abv":null},"lemon":{"n":"柠檬","t":"水果","abv":null},"orange":{"n":"橙子","t":"水果","abv":null},"mint":{"n":"薄荷","t":"植物材料","abv":null},"olive":{"n":"青橄榄","t":"植物材料","abv":null},"cherry":{"n":"酒渍樱桃","t":"水果","abv":null},"sugar-cube":{"n":"方糖/白砂糖","t":"调料","abv":null},"egg-white":{"n":"蛋白","t":"其他","abv":null},"celery":{"n":"芹菜杆","t":"植物材料","abv":null},"coffee-bean":{"n":"咖啡豆（装饰）","t":"植物材料","abv":null},"nutmeg":{"n":"肉豆蔻/肉桂粉","t":"调料","abv":null},"worcestershire":{"n":"伍斯特酱","t":"调料","abv":null},"tabasco":{"n":"塔巴斯科辣酱","t":"调料","abv":null},"salt":{"n":"盐","t":"调料","abv":null},"pepper":{"n":"黑胡椒","t":"调料","abv":null},"ice":{"n":"冰块","t":"其他","abv":null}};
let pan = new Set();
try{ pan = new Set(JSON.parse(localStorage.getItem('ck_pantry')||'[]')); }catch(e){}
const savePan = () => { try{ localStorage.setItem('ck_pantry', JSON.stringify([...pan])); }catch(e){} };
if(localStorage.getItem('ck_pantry_init')===null){
  ['ice','salt','pepper','sugar-cube','x:水'].forEach(k=>pan.add(k));
  savePan(); try{ localStorage.setItem('ck_pantry_init','1'); }catch(e){}
}
const TY_CLASS = {'酒':'wine','水果':'fruit','糖浆':'syrup','饮料':'drink','植物材料':'plant','调料':'season','其他':'other'};
const tyTag = t => t ? `<span class="ty ${TY_CLASS[t]||'other'}">（${t}）</span>` : '';
function panInfo(d){
  const seen=new Set(), miss=[];
  d.ings.forEach(i=>{ if(!pan.has(i.k) && !seen.has(i.k)){ seen.add(i.k); miss.push(i); } });
  return { miss, can: d.ings.length>0 && miss.length===0 };
}
const missName = i => (i.zh||'').replace(/（[^）]*）/g,'');
const recRank = d => { const p = panInfo(d); return p.can ? 0 : p.miss.length; };

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1400); }

// 筛选条
const CATS = [...new Set(DATA.map(d=>d.cat).filter(Boolean))];
const ALCS = [...new Set(DATA.map(d=>d.alc).filter(Boolean))];
function chip(label, on, fn){
  const b=document.createElement('button'); b.className='chip'+(on?' on':''); b.textContent=label;
  b.onclick=fn; return b;
}
function drawChips(){
  catsEl.innerHTML=''; alcsEl.innerHTML='';
  catsEl.appendChild(chip((state.pan?'✓ ':'')+'按我的材料排'+(pan.size?'（'+pan.size+'）':''), state.pan, ()=>{
    if(!state.pan && !pan.size){ toast('先去「我的材料」勾上你有的材料'); openPantry(); return; }
    state.pan=!state.pan; state.shown=60; drawChips(); render(); }));
  catsEl.appendChild(chip('★ 收藏 '+favs.size, state.fav, ()=>{ state.fav=!state.fav; state.shown=60; drawChips(); render(); }));
  catsEl.appendChild(chip('全部', !state.cat, ()=>{ state.cat=''; state.shown=60; drawChips(); render(); }));
  CATS.forEach(c=>catsEl.appendChild(chip(c, state.cat===c, ()=>{
    state.cat = state.cat===c ? '' : c; state.shown=60; drawChips(); render(); })));
  alcsEl.appendChild(chip('不限酒精度', !state.alc, ()=>{ state.alc=''; state.shown=60; drawChips(); render(); }));
  const typesEl = document.getElementById('types');
  if(typesEl){
    typesEl.innerHTML = '';
    TYPES.forEach(t=>{
      if(!DATA.some(d=>d.ings.some(i=>i.t===t))) return;
      typesEl.appendChild(chip(t, state.ty===t, ()=>{
        state.ty = state.ty===t ? '' : t; state.shown=60; drawChips(); render(); }));
    });
  }
  ALCS.forEach(a=>alcsEl.appendChild(chip(a, state.alc===a, ()=>{
    state.alc = state.alc===a ? '' : a; state.shown=60; drawChips(); render(); })));
}
function match(d){
  if (state.fav && !favs.has(d.id)) return false;
  if (state.cat && d.cat !== state.cat) return false;
  if (state.alc && d.alc !== state.alc) return false;
  if (state.ty && !d.ings.some(i => i.t === state.ty)) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return d.cn.toLowerCase().includes(q) || d.en.toLowerCase().includes(q) ||
         d.ings.some(i => (i.zh||'').toLowerCase().includes(q));
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const bili = kw => 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(kw);
const bili2 = kw => 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(kw);
const TYPES = ['酒','水果','糖浆','饮料','植物材料','调料','其他'];
function render(){
  const hits = DATA.filter(match);
  if(state.pan) hits.sort((a,b)=> recRank(a)-recRank(b) || (a.cn||'').localeCompare(b.cn||'','zh'));
  const canN = state.pan ? hits.filter(d=>panInfo(d).can).length : 0;
  $('#cnt').textContent = state.pan ? ('能做 '+canN+' 款') : (hits.length + ' 款');
  const slice = hits.slice(0, state.shown);
  listEl.innerHTML = slice.map(d => `
    <div class="row" data-id="${d.id}">
      <img loading="lazy" src="${d.img}" alt="">
      <div class="t">
        <div class="n">${esc(d.cn)}</div>
        <div class="e">${esc(d.en)}</div>
        <div class="m">
          ${d.cat?`<span class="tag">${esc(d.cat)}</span>`:''}
          ${d.alc?`<span class="tag">${esc(d.alc)}</span>`:''}
          ${d.cost?`<span class="tag">≈¥${d.cost[0]}–${d.cost[1]}</span>`:''}
        </div>
        ${state.pan?(()=>{const p=panInfo(d);
          return p.can ? `<div class="rec can">✓ 你的材料全齐，现在就能调</div>`
                       : `<div class="rec miss">还缺 ${p.miss.length} 样：${p.miss.slice(0,3).map(missName).join('、')}${p.miss.length>3?'…':''}</div>`;})():''}
      </div>
      <div class="star ${favs.has(d.id)?'on':''}" data-fav="${d.id}">${favs.has(d.id)?'★':'☆'}</div>
    </div>`).join('') || '<div class="empty">没有匹配的酒<br>换个词试试？</div>';
  if (hits.length > state.shown)
    listEl.insertAdjacentHTML('beforeend',
      `<div class="more" id="more">还有 ${hits.length-state.shown} 款，点这里继续加载</div>`);
}
listEl.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f){ const id=f.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFav(); toast(favs.has(id)?'已收藏 ★':'已取消收藏');
    drawChips(); render(); return; }
  if (e.target.closest('#more')){ state.shown += 60; render(); return; }
  const r = e.target.closest('.row');
  if (r) openDetail(r.dataset.id);
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); state.shown = 60; render(); });

function openDetail(id){
  const d = DATA.find(x => x.id === id); if (!d) return;
  detailEl.innerHTML = `
    <div class="dbar">
      <button class="back" id="bk">‹ 返回</button>
      <div class="star ${favs.has(d.id)?'on':''}" data-dfav="${d.id}" style="margin-left:auto">${favs.has(d.id)?'★ 已收藏':'☆ 收藏'}</div>
    </div>
    <div class="dwrap">
      ${d.img?`<img class="hero" src="${d.img}" alt="">`:''}
      <div class="dname">${esc(d.cn)}</div>
      <div class="den">${esc(d.en)}</div>
      <div class="dmeta">
        ${d.alc?`<span class="tag">${esc(d.alc)}</span>`:''}
        ${d.glass?`<span class="tag">${esc(d.glass)}</span>`:''}
        ${d.cost?`<span class="tag">材料约 ¥${d.cost[0]}–${d.cost[1]}</span>`:''}
        ${d.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 2px">
        <a class="vbtn" target="_blank" rel="noopener"
           style="display:inline-block;padding:11px 15px;border-radius:11px;background:var(--chip);color:var(--fg);text-decoration:none;font-size:14px"
           href="${bili((d.cn||d.en)+' 鸡尾酒 调制 教程')}">▶ 看视频教程</a>
        <a class="vbtn" target="_blank" rel="noopener"
           style="display:inline-block;padding:11px 15px;border-radius:11px;background:var(--chip);color:var(--fg);text-decoration:none;font-size:14px"
           href="${bili2((d.cn||d.en)+' 配方')}">🔍 更多做法</a>
      </div>
      <div class="lab">需要什么</div>
      <div class="ing">${d.ings.map(i=>`<div><span>${esc(i.zh)}${tyTag(i.t)}</span>
        <span class="mm">${esc(i.m)}<button class="have ${pan.has(i.k)?'on':''}" data-pk="${esc(i.k)}">${pan.has(i.k)?'✓ 我有':'＋我有'}</button></span></div>`).join('')}</div>
      ${pan.size?(()=>{const p=panInfo(d);
        return '<div class="lab">用我的材料看</div>' + (p.can
          ? `<div class="pnote" style="color:#9ed07f;background:#1d2c1a">✓ <b>你的材料全齐</b>，现在就能调这一杯。</div>`
          : `<div class="pnote">还缺 <b>${p.miss.length}</b> 样：<b>${p.miss.map(missName).join('、')}</b>
             <div style="margin-top:8px"><button class="have" id="addmiss">复制缺的材料</button></div></div>`);})():''}
      <div class="lab">怎么做</div>
      <ol class="steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      ${d.tip?`<div class="lab">小贴士</div><div class="tip">${esc(d.tip)}</div>`:''}
      <div class="foot">编号 ${d.id} · 数据与图片来自 TheCocktailDB<br>仅供个人学习参考 · 价格为估算区间，非实时报价</div>
    </div>`;
  detailEl.classList.add('show');
  detailEl.scrollTop = 0;
  location.hash = 'd/' + d.id;
  $('#bk').onclick = closeDetail;
  detailEl.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.pk; pan.has(k)?pan.delete(k):pan.add(k);
    savePan(); openDetail(d.id); drawChips(); render(); updatePcnt(); });
  const am = detailEl.querySelector('#addmiss');
  if(am) am.onclick = () => {
    const txt = panInfo(d).miss.map(missName).join('、');
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('已复制缺的材料')).catch(()=>toast(txt));
    else toast(txt);
  };
  detailEl.querySelector('[data-dfav]').onclick = ev => {
    const id2 = ev.currentTarget.dataset.dfav;
    favs.has(id2) ? favs.delete(id2) : favs.add(id2);
    saveFav(); toast(favs.has(id2)?'已收藏 ★':'已取消收藏');
    drawChips(); render(); openDetail(id2);
  };
}
function closeDetail(){ detailEl.classList.remove('show'); history.replaceState(null,'',location.pathname); }
detailEl.addEventListener('click', e => { if (e.target.id === 'bk' || e.target.closest('#bk')) closeDetail(); });
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/^#d\/(\d+)/);
  if (m) {
    if (!detailEl.classList.contains('show')) openDetail(m[1]);
  } else if (detailEl.classList.contains('show')) {
    closeDetail();
  }
});

// ===== 我的材料面板 =====
const panEl = $('#pantry');
function updatePcnt(){
  const el = $('#pcnt'); if(el) el.textContent = pan.size;
  const mp = $('#mypan'); if(mp) mp.classList.toggle('on', pan.size>0);
}
function renderPantry(){
  const lib = Object.keys(LIB);
  const extras = [...pan].filter(k=>String(k).startsWith('x:'));
  panEl.innerHTML = `
    <div class="dbar"><button class="back" id="pbk">‹ 返回</button>
      <div style="margin-left:auto;color:var(--dim);font-size:13px" id="pn">已勾 ${pan.size} 项</div></div>
    <div class="dwrap">
      <div class="pnote">勾上你<b>家里已经有</b>的材料，自动存在本机、下次打开还在。<br>
        勾完回列表点「<b>按我的材料排</b>」：<span style="color:#9ed07f">✓ 全齐的排最前</span>（现在就能调），
        其余按「<b>还缺几样</b>」从少到多排。</div>
      <button class="back" id="pclear" style="margin-bottom:10px">全部清空</button>
      ${lib.map(k=>{ const g=LIB[k];
        return `<label class="prow"><input type="checkbox" data-k="${k}" ${pan.has(k)?'checked':''}>
          <span>${esc(g.n)}${tyTag(g.t)}</span><span class="rt">${g.abv?('约 '+g.abv+'%'):''}</span></label>`;}).join('')}
      ${extras.length?'<div class="lab">其他（材料库没收录的，你自己加的）</div>'+extras.map(k=>
        `<label class="prow"><input type="checkbox" data-k="${esc(k)}" checked><span>${esc(k.slice(2))}</span></label>`).join(''):''}
    </div>`;
  panEl.querySelector('#pbk').onclick = closePantry;
  panEl.querySelector('#pclear').onclick = () => {
    pan.clear(); savePan(); renderPantry(); drawChips(); render(); updatePcnt(); };
  panEl.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{
    i.checked?pan.add(i.dataset.k):pan.delete(i.dataset.k);
    savePan();
    const pn = panEl.querySelector('#pn'); if(pn) pn.textContent = '已勾 '+pan.size+' 项';
    drawChips(); render(); updatePcnt();
  });
}
function openPantry(){ renderPantry(); panEl.classList.add('show'); }
function closePantry(){ panEl.classList.remove('show'); }
$('#mypan').onclick = openPantry;

updatePcnt();
drawChips();
render();
const m = location.hash.match(/^#d\/(\d+)/);
if (m) openDetail(m[1]);
</script></body></html>
